                          ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm'
                          : 'text-zinc-600 dark:text-zinc-400'
                      }"
                    >
                      ${opt.label}
                    </button>
                  `
                    )
                    .join('')}
                </div>

                ${
                  f.scheduleType === 'specific_days'
                    ? `<div class="grid grid-cols-7 gap-1.5 pt-1">
                        ${DAY_LABELS_MON_FIRST.map(({ day, label, full }) => {
                          const selected = f.daysOfWeek.includes(day);
                          return `
                            <button
                              type="button"
                              data-action="hm-toggle-day"
                              data-day="${day}"
                              aria-label="${full}"
                              class="h-10 rounded-xl text-xs font-semibold transition-colors ${
                                selected
                                  ? 'bg-[#007AFF] text-white'
                                  : 'bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 border border-zinc-200/60 dark:border-zinc-800'
                              }"
                            >
                              ${label}
                            </button>
                          `;
                        }).join('')}
                      </div>`
                    : ''
                }

                ${
                  f.scheduleType === 'times_per_week'
                    ? `<div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-zinc-100/70 dark:bg-zinc-900 border border-zinc-200/60 dark:border-zinc-800">
                        <span class="text-sm text-zinc-700 dark:text-zinc-300">Cel tygodniowy:</span>
                        <div class="flex items-center gap-1.5">
                          ${[1, 2, 3, 4, 5, 6]
                            .map(
                              (n) => `
                            <button
                              type="button"
                              data-action="hm-set-times-week"
                              data-count="${n}"
                              class="w-8 h-8 rounded-lg text-xs font-semibold ${
                                Number(f.timesPerWeek) === n
                                  ? 'bg-[#007AFF] text-white'
                                  : 'bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300'
                              }"
                            >
                              ${n}×
                            </button>
                          `
                            )
                            .join('')}
                        </div>
                      </div>`
                    : ''
                }
              </div>

              <!-- Godzina, Ważność, Przypomnienie -->
              <div class="divide-y divide-zinc-200/70 dark:divide-zinc-800 rounded-2xl bg-zinc-50 dark:bg-zinc-900/70 border border-zinc-200/70 dark:border-zinc-800">
                <div class="flex items-center justify-between px-4 py-3">
                  <div>
                    <label for="hm-exec-time" class="text-sm font-medium block">Pora wykonania (opcjonalnie)</label>
                    <span class="text-xs text-zinc-500 dark:text-zinc-400">Wyświetlana na liście Dzisiaj</span>
                  </div>
                  <input
                    id="hm-exec-time"
                    type="time"
                    value="${escapeHtml(f.executionTime)}"
                    class="px-2.5 py-1.5 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-base"
                  />
                </div>

                <div class="flex items-center justify-between px-4 py-3">
                  <div>
                    <span class="text-sm font-medium block">Ważny nawyk</span>
                    <span class="text-xs text-zinc-500 dark:text-zinc-400">Subtelne wyróżnienie priorytetu</span>
                  </div>
                  <button
                    type="button"
                    role="switch"
                    aria-checked="${f.important}"
                    data-action="hm-toggle-important"
                    class="w-12 h-7 flex items-center rounded-full p-1 transition-colors ${
                      f.important ? 'bg-[#007AFF]' : 'bg-zinc-300 dark:bg-zinc-700'
                    }"
                  >
                    <span class="bg-white w-5 h-5 rounded-full shadow transform transition-transform ${
                      f.important ? 'translate-x-5' : 'translate-x-0'
                    }"></span>
                  </button>
                </div>

                <div class="px-4 py-3 space-y-2.5">
                  <div class="flex items-center justify-between">
                    <div>
                      <span class="text-sm font-medium block">Przypomnienie</span>
                      <span class="text-xs text-zinc-500 dark:text-zinc-400">Powiadomienie w zaplanowane dni</span>
                    </div>
                    <button
                      type="button"
                      role="switch"
                      aria-checked="${f.reminderEnabled}"
                      data-action="hm-toggle-reminder"
                      class="w-12 h-7 flex items-center rounded-full p-1 transition-colors ${
                        f.reminderEnabled ? 'bg-[#007AFF]' : 'bg-zinc-300 dark:bg-zinc-700'
                      }"
                    >
                      <span class="bg-white w-5 h-5 rounded-full shadow transform transition-transform ${
                        f.reminderEnabled ? 'translate-x-5' : 'translate-x-0'
                      }"></span>
                    </button>
                  </div>

                  ${
                    f.reminderEnabled
                      ? `<div class="flex items-center justify-between pt-1">
                          <label for="hm-rem-time" class="text-xs text-zinc-600 dark:text-zinc-300">Godzina przypomnienia:</label>
                          <input
                            id="hm-rem-time"
                            type="time"
                            value="${escapeHtml(f.reminderTime)}"
                            class="px-2.5 py-1 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-base"
                          />
                        </div>`
                      : ''
                  }

                  ${
                    f.reminderInfo || f.reminderEnabled
                      ? `<p class="text-[11px] leading-relaxed text-zinc-500 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-800/70 p-2.5 rounded-xl">
                          ${escapeHtml(f.reminderInfo || envStatus.backgroundPushNote)}
                        </p>`
                      : ''
                  }
                </div>
              </div>

              <div class="space-y-1.5">
                <label for="hm-note" class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                  Krótka notatka (opcjonalnie)
                </label>
                <input
                  id="hm-note"
                  type="text"
                  maxLength="120"
                  placeholder="np. Po zaparzeniu porannej kawy"
                  value="${escapeHtml(f.note)}"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-base focus:outline-none focus:ring-2 focus:ring-[#007AFF]"
                />
              </div>

              ${
                f.isEdit
                  ? `<div class="pt-2 border-t border-zinc-200/80 dark:border-zinc-800 space-y-2.5">
                      <div class="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          data-action="hm-toggle-pause"
                          class="py-2.5 px-3 rounded-xl text-xs font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200"
                        >
                          ${f.status === 'paused' ? 'Wznów nawyk' : 'Wstrzymaj tymczasowo'}
                        </button>
                        <button
                          type="button"
                          data-action="hm-toggle-archive"
                          class="py-2.5 px-3 rounded-xl text-xs font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200"
                        >
                          ${f.status === 'archived' ? 'Przywróć z archiwum' : 'Archiwizuj (zachowaj historię)'}
                        </button>
                      </div>

                      ${
                        f.status !== 'active'
                          ? `<p class="text-xs text-center text-amber-600 dark:text-amber-400">
                              Status po zapisaniu: <strong>${f.status === 'paused' ? 'Wstrzymany' : 'Zarchiwizowany'}</strong>
                            </p>`
                          : ''
                      }

                      ${
                        !f.confirmDelete
                          ? `<button
                              type="button"
                              data-action="hm-ask-delete"
                              class="w-full py-2.5 rounded-xl text-xs font-semibold text-[#FF3B30] bg-red-50/70 dark:bg-red-950/30 border border-red-200/60 dark:border-red-900/50"
                            >
                              × Usuń nawyk oraz jego historię
                            </button>`
                          : `<div class="p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 space-y-2">
                              <p class="text-xs text-red-700 dark:text-red-300 font-medium">
                                Czy na pewno chcesz trwale usunąć ten nawyk i całą jego historię? Aby zachować historię, użyj opcji Archiwizuj.
                              </p>
                              <div class="flex gap-2">
                                <button type="button" data-action="hm-cancel-delete" class="flex-1 py-2 rounded-lg text-xs font-medium bg-white dark:bg-zinc-800">
                                  Anuluj
                                </button>
                                <button
                                  type="button"
                                  data-action="hm-confirm-delete"
                                  data-habit-id="${escapeHtml(f.id)}"
                                  class="flex-1 py-2 rounded-lg text-xs font-semibold bg-[#FF3B30] text-white"
                                >
                                  Potwierdź usunięcie
                                </button>
                              </div>
                            </div>`
                      }
                    </div>`
                  : ''
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderPeriodModal() {
      if (!state.periodModalOpen || !state.periodForm) return '';
      const pf = state.periodForm;

      return `
        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-[2px] p-0 sm:p-4" role="dialog" aria-modal="true">
          <div class="w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white dark:bg-[#16161B] border-t sm:border border-zinc-200 dark:border-zinc-800 shadow-2xl pb-8">
            <div class="sticky top-0 z-10 flex items-center justify-between px-5 py-4 bg-white/95 dark:bg-[#16161B]/95 backdrop-blur border-b border-zinc-100 dark:border-zinc-800">
              <button type="button" data-action="close-period-modal" class="text-sm font-medium text-zinc-500 py-1 px-2 -ml-2 rounded-lg">
                Anuluj
              </button>
              <h2 class="text-base font-semibold">Oznacz okres w kalendarzu</h2>
              <button type="button" data-action="save-period-modal" class="text-sm font-semibold text-[#007AFF] py-1 px-2 -mr-2 rounded-lg">
                Zapisz
              </button>
            </div>

            <div class="px-5 pt-4 space-y-5">
              ${
                pf.error
                  ? `<div role="alert" class="p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 text-xs text-red-700 dark:text-red-300">
                      ${escapeHtml(pf.error)}
                    </div>`
                  : ''
              }

              <p class="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed">
                Zaznacz w kalendarzu dłuższy okres (np. wyjazd, urlop, delegację lub chorobę). Nawyki nadal trwają zgodnie z harmonogramem, ale w tle kalendarza zobaczysz kolorową wstęgę wyjaśniającą kontekst tych dni.
              </p>

              <!-- Szybkie podpowiedzi -->
              <div class="space-y-1.5">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400 block">
                  Szybki wybór tematu:
                </span>
                <div class="flex flex-wrap gap-1.5">
                  ${PERIOD_SUGGESTIONS.map(
                    (s, idx) => `
                      <button
                        type="button"
                        data-action="apply-period-suggestion"
                        data-index="${idx}"
                        class="text-xs px-3 py-1.5 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-blue-50 dark:hover:bg-blue-950/40 text-zinc-700 dark:text-zinc-200 font-medium"
                      >
                        ${escapeHtml(s.name)}
                      </button>
                    `
                  ).join('')}
                </div>
              </div>

              <!-- Nazwa okresu -->
              <div class="space-y-1.5">
                <label for="pm-name" class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                  Nazwa okresu *
                </label>
                <input
                  id="pm-name"
                  type="text"
                  placeholder="np. Wyjazd w góry, Delegacja, Przeziębienie..."
                  value="${escapeHtml(pf.name)}"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-base focus:outline-none focus:ring-2 focus:ring-[#007AFF]"
                />
              </div>

              <!-- Zakres dat Od - Do -->
              <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                  <label for="pm-start" class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                    Data od *
                  </label>
                  <input
                    id="pm-start"
                    type="date"
                    value="${escapeHtml(pf.startDate)}"
                    class="w-full px-3 py-2.5 rounded-xl bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-base"
                  />
                </div>
                <div class="space-y-1.5">
                  <label for="pm-end" class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                    Data do *
                  </label>
                  <input
                    id="pm-end"
                    type="date"
                    value="${escapeHtml(pf.endDate)}"
                    class="w-full px-3 py-2.5 rounded-xl bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-base"
                  />
                </div>
              </div>

              <!-- Wybór koloru tła w kalendarzu -->
              <div class="space-y-2">
                <span class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                  Kolor oznaczenia w kalendarzu
                </span>
                <div class="grid grid-cols-5 gap-2">
                  ${Object.values(PERIOD_COLORS)
                    .map((c) => {
                      const active = pf.color === c.id;
                      return `
                        <button
                          type="button"
                          data-action="pm-set-color"
                          data-color="${c.id}"
                          class="flex flex-col items-center gap-1.5 p-2 rounded-xl border text-[11px] font-medium transition-all ${
                            active
                              ? 'border-[#007AFF] bg-blue-50/50 dark:bg-blue-950/40 ring-2 ring-[#007AFF]/40'
                              : 'border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900'
                          }"
                        >
                          <span class="w-5 h-5 rounded-full ${c.dot}"></span>
                          <span class="truncate max-w-full">${c.label}</span>
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              </div>

              <!-- Opcjonalna notatka -->
              <div class="space-y-1.5">
                <label for="pm-note" class="block text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                  Krótka notatka (opcjonalnie)
                </label>
                <input
                  id="pm-note"
                  type="text"
                  maxLength="100"
                  placeholder="np. Brak dostępu do siłowni"
                  value="${escapeHtml(pf.note)}"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-base focus:outline-none focus:ring-2 focus:ring-[#007AFF]"
                />
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHabitDetailModal(completionMap) {
      if (!state.detailHabitId) return '';
      const habit = state.habits.find((h) => h.id === state.detailHabitId);
      if (!habit) return '';

      const todayStr = state.todayStr;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedWeekDays = getOrderedWeekDays(weekStartsOn);
      const stats = calculateHabitStats(
        habit,
        todayStr,
        state.detailMonthYear.year,
        state.detailMonthYear.month,
        completionMap,
        weekStartsOn
      );
      const gridCells = getCalendarGridDays(
        state.detailMonthYear.year,
        state.detailMonthYear.month,
        weekStartsOn
      );

      return `
        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-[2px] p-0 sm:p-4" role="dialog" aria-modal="true">
          <div class="w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white dark:bg-[#16161B] border-t sm:border border-zinc-200 dark:border-zinc-800 shadow-2xl pb-8">
            <div class="sticky top-0 z-10 flex items-center justify-between px-5 py-4 bg-white/95 dark:bg-[#16161B]/95 backdrop-blur border-b border-zinc-100 dark:border-zinc-800">
              <button type="button" data-action="close-habit-detail" class="text-sm font-medium text-zinc-500 py-1 px-2 -ml-2 rounded-lg">
                Zamknij
              </button>
              <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Historia nawyku</span>
              <div class="flex items-center gap-2 -mr-2">
                <button
                  type="button"
                  data-action="edit-habit-from-detail"
                  data-habit-id="${escapeHtml(habit.id)}"
                  class="text-sm font-semibold text-[#007AFF] py-1 px-2 rounded-lg"
                >
                  Edytuj
                </button>
                <button
                  type="button"
                  data-action="detail-ask-delete"
                  title="Usuń nawyk"
                  aria-label="Usuń nawyk"
                  class="w-7 h-7 rounded-lg bg-red-50 dark:bg-red-950/40 text-[#FF3B30] font-bold text-base flex items-center justify-center"
                >
                  ×
                </button>
              </div>
            </div>

            <div class="px-5 pt-4 space-y-5">
              ${
                state.detailConfirmDelete
                  ? `<div class="p-3.5 rounded-2xl bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 space-y-2.5">
                      <p class="text-xs font-semibold text-red-800 dark:text-red-200">
                        Czy na pewno chcesz trwale usunąć nawyk „${escapeHtml(habit.name)}” wraz z jego historią?
                      </p>
                      <div class="flex gap-2">
                        <button type="button" data-action="detail-cancel-delete" class="flex-1 py-2 rounded-xl text-xs font-medium bg-white dark:bg-zinc-800">
                          Anuluj
                        </button>
                        <button
                          type="button"
                          data-action="detail-confirm-delete"
                          data-habit-id="${escapeHtml(habit.id)}"
                          class="flex-1 py-2 rounded-xl text-xs font-semibold bg-[#FF3B30] text-white"
                        >
                          Usuń nawyk
                        </button>
                      </div>
                    </div>`
                  : ''
              }

              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h2 class="text-xl font-bold tracking-tight">${escapeHtml(habit.name)}</h2>
                  ${
                    habit.important
                      ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-50 dark:bg-blue-950/60 text-[#007AFF]">Ważny</span>`
                      : ''
                  }
                </div>
                <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">
                  Harmonogram: <strong>${escapeHtml(formatScheduleLabel(habit.schedule))}</strong>
                  ${habit.executionTime ? ` • Godzina: ${escapeHtml(habit.executionTime)}` : ''}
                </p>
                ${
                  habit.note
                    ? `<p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 italic">„${escapeHtml(habit.note)}”</p>`
                    : ''
                }
              </div>

              <div class="grid grid-cols-3 gap-2.5">
                <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-900/80 border border-zinc-200/60 dark:border-zinc-800 p-3">
                  <span class="text-xs text-zinc-500 dark:text-zinc-400 block">Bieżąca seria</span>
                  <p class="text-xl font-bold mt-1">${stats.currentStreak}</p>
                  <span class="text-[11px] text-zinc-400">z rzędu</span>
                </div>
                <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-900/80 border border-zinc-200/60 dark:border-zinc-800 p-3">
                  <span class="text-xs text-zinc-500 dark:text-zinc-400 block">Najlepsza</span>
                  <p class="text-xl font-bold mt-1">${stats.bestStreak}</p>
                  <span class="text-[11px] text-zinc-400">rekord</span>
                </div>
                <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-900/80 border border-zinc-200/60 dark:border-zinc-800 p-3">
                  <span class="text-xs text-zinc-500 dark:text-zinc-400 block">W miesiącu</span>
                  <p class="text-xl font-bold mt-1">${stats.monthCompletionRate}%</p>
                  <span class="text-[11px] text-zinc-400">${stats.monthCompletedCount}/${stats.monthScheduledCount} dni</span>
                </div>
              </div>

              <div class="rounded-2xl bg-zinc-50/70 dark:bg-zinc-900/60 border border-zinc-200/70 dark:border-zinc-800 p-4 space-y-3">
                <div class="flex items-center justify-between">
                <div class="grid grid-cols-7 gap-y-1.5 text-center">
                  ${orderedWeekDays
                    .map((d) => `<div class="text-[11px] font-medium text-zinc-400 py-1">${d.label}</div>`)
                    .join('')}
                  ${gridCells
                    .map(({ dateStr, inCurrentMonth }) => {
                      const dayState = getHabitDayState(habit, dateStr, todayStr, completionMap, weekStartsOn);
                      const dayNum = Number(dateStr.split('-')[2]);
                      const canToggle = dayState !== 'future';
                      const ribbon = getPeriodRibbonInfo(dateStr);

                      let cellStyle = 'bg-transparent text-zinc-300 dark:text-zinc-700 cursor-default';
                      if (dayState === 'completed') {
                        cellStyle = 'bg-[#28CD41] text-white font-semibold shadow-sm';
                      } else if (dayState === 'missed') {
                        cellStyle =
                          'bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-300 border border-red-200 dark:border-red-900/60';
                      } else if (dayState === 'today_pending') {
                        cellStyle =
                          'bg-blue-50 dark:bg-blue-950/50 text-[#007AFF] ring-2 ring-[#007AFF] font-semibold';
                      } else if (dayState === 'unscheduled') {
                        cellStyle = 'bg-transparent text-zinc-400 dark:text-zinc-600';
                      }

                      return `
                        <div class="relative py-0.5 px-0.5 ${ribbon ? `${ribbon.meta.ribbonBg} ${ribbon.radiusClass}` : ''}">
                          ${
                            ribbon
                              ? `<span class="absolute top-0.5 inset-x-1 h-1 rounded-full ${ribbon.meta.bar} opacity-85" title="${escapeHtml(ribbon.period.name)}"></span>`
                              : ''
                          }
                          <button
                            type="button"
                            ${!canToggle ? 'disabled' : ''}
                            data-action="toggle-habit-date"
                            data-habit-id="${escapeHtml(habit.id)}"
                            data-date="${dateStr}"
                            title="${ribbon ? `${dateStr} • ${escapeHtml(ribbon.period.name)}` : dateStr}"
                            class="w-full h-10 rounded-xl flex flex-col items-center justify-center text-xs transition-transform ${
                              !inCurrentMonth ? 'opacity-25' : ''
                            } ${cellStyle} ${canToggle ? 'active:scale-90' : ''}"
                          >
                            <span>${dayNum}</span>
                          </button>
                        </div>
                      `;
                    })
                    .join('')}
                </div>

                ${renderMonthPeriodsList(state.detailMonthYear.year, state.detailMonthYear.month, false)}

                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-zinc-200/60 dark:border-zinc-800 text-[11px] text-zinc-500 dark:text-zinc-400">
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-[#28CD41] inline-block"></span>
                    <span>Wykonany dzień</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-100 dark:bg-red-950 border border-red-300 dark:border-red-800 inline-block"></span>
                    <span>Zaległy (pominięty)</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full ring-2 ring-[#007AFF] inline-block"></span>
                    <span>Dzisiaj (jeszcze trwa)</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full border border-zinc-300 dark:border-zinc-700 inline-block"></span>
                    <span>Poza harmonogramem / przyszły</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const tabs = [
        {
          id: 'today',
          label: 'Dzisiaj',
          svg: `<svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>`
        },
        {
          id: 'planner',
          label: 'Planer',
          svg: `<svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>`
        },
        {
          id: 'settings',
          label: 'Ustawienia',
          svg: `<svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>`
        }
      ];

      return `
        <nav aria-label="Główna nawigacja" class="fixed bottom-0 inset-x-0 z-30 bg-white/90 dark:bg-[#16161B]/90 backdrop-blur-md border-t border-zinc-200/80 dark:border-zinc-800/80 safe-pb-nav">
          <div class="max-w-lg mx-auto grid grid-cols-3 h-16 px-2">
            ${tabs
              .map((t) => {
                const isActive = state.activeTab === t.id;
                return `
                  <button
                    type="button"
                    data-action="switch-tab"
                    data-tab="${t.id}"
                    aria-current="${isActive ? 'page' : 'false'}"
                    class="flex flex-col items-center justify-center gap-1 rounded-xl transition-colors active:scale-95 ${
                      isActive
                        ? 'text-[#007AFF]'
                        : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200'
                    }"
                  >
                    ${t.svg}
                    <span class="text-[11px] font-medium tracking-tight">${t.label}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        </nav>
      `;
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (!state.loaded) {
        appEl.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-8 text-sm text-zinc-400">
            Ładowanie danych Rutyna...
          </div>
        `;
        return;
      }

      const completionMap = buildCompletionMap(state.completions);

      let mainContent = '';
      if (state.activeTab === 'today') {
        mainContent =
          state.internalView === 'overall_history'
            ? renderOverallHistoryView(completionMap)
            : renderTodayView(completionMap);
      } else if (state.activeTab === 'planner') {
        mainContent = renderPlannerView(completionMap);
      } else {
        mainContent = renderSettingsView();
      }

      const toastHtml = state.toast
        ? `<div class="fixed top-16 inset-x-4 max-w-md mx-auto z-50 px-4 py-3 rounded-2xl shadow-lg border text-xs font-medium flex items-center justify-between ${
            state.toast.type === 'error'
              ? 'bg-red-50 dark:bg-red-950 border-red-200 dark:border-red-900 text-red-700 dark:text-red-200'
              : state.toast.type === 'success'
              ? 'bg-emerald-50 dark:bg-emerald-950 border-emerald-200 dark:border-emerald-900 text-emerald-800 dark:text-emerald-200'
              : 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-800 dark:text-zinc-100'
          }">
            <span>${escapeHtml(state.toast.text)}</span>
          </div>`
        : '';

      appEl.innerHTML = `
        ${renderStickyTopBar(completionMap)}
        ${toastHtml}
        <main class="flex-1 w-full max-w-lg mx-auto px-4 pt-2 safe-main-pb">
          ${mainContent}
        </main>
        ${renderBottomNav()}
        ${renderHabitModal()}
        ${renderPeriodModal()}
        ${renderHabitDetailModal(completionMap)}
      `;
    }

    /***********************************************************************
     * 10. DELEGACJA ZDARZEŃ INTERFEJSU
     ***********************************************************************/
    function syncHabitModalInputs() {
      if (!state.habitModalOpen || !state.habitForm) return;
      const nameEl = document.getElementById('hm-name');
      const execTimeEl = document.getElementById('hm-exec-time');
      const remTimeEl = document.getElementById('hm-rem-time');
      const noteEl = document.getElementById('hm-note');

      if (nameEl) state.habitForm.name = nameEl.value;
      if (execTimeEl) state.habitForm.executionTime = execTimeEl.value;
      if (remTimeEl) state.habitForm.reminderTime = remTimeEl.value;
      if (noteEl) state.habitForm.note = noteEl.value;
    }

    function syncPeriodModalInputs() {
      if (!state.periodModalOpen || !state.periodForm) return;
      const nameEl = document.getElementById('pm-name');
      const startEl = document.getElementById('pm-start');
      const endEl = document.getElementById('pm-end');
      const noteEl = document.getElementById('pm-note');

      if (nameEl) state.periodForm.name = nameEl.value;
      if (startEl) state.periodForm.startDate = startEl.value;
      if (endEl) state.periodForm.endDate = endEl.value;
      if (noteEl) state.periodForm.note = noteEl.value;
    }

    function syncPlannerFormInputs() {
      if (!state.plannerFormOpen || !state.plannerForm) return;
      const contentEl = document.getElementById('pf-content');
      const descEl = document.getElementById('pf-description');
      const timeEl = document.getElementById('pf-time');
      const linkEl = document.getElementById('pf-linked-habit');

      if (contentEl) state.plannerForm.content = contentEl.value;
      if (descEl) state.plannerForm.description = descEl.value;
      if (timeEl) state.plannerForm.time = timeEl.value;
      if (linkEl) state.plannerForm.linkedHabitId = linkEl.value;
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');
      syncHabitModalInputs();
      syncPeriodModalInputs();
      syncPlannerFormInputs();

      switch (action) {
        case 'switch-tab': {
          const tab = btn.getAttribute('data-tab');
          state.activeTab = tab;
          state.internalView = null;
          state.confirmClearAllData = false;
          state.inlineDeleteHabitId = null;
          renderApp();
          break;
        }
        case 'open-overall-history': {
          state.internalView = 'overall_history';
          renderApp();
          break;
        }
        case 'close-overall-history': {
          state.internalView = null;
          renderApp();
          break;
        }
        case 'set-history-mode': {
          state.historyMode = btn.getAttribute('data-mode');
          renderApp();
          break;
        }
        case 'select-history-date': {
          state.historySelectedDate = btn.getAttribute('data-date');
          renderApp();
          break;
        }
        case 'history-prev-month': {
          const d = new Date(state.historyMonthYear.year, state.historyMonthYear.month - 1, 1, 12, 0, 0);
          state.historyMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'history-next-month': {
          const d = new Date(state.historyMonthYear.year, state.historyMonthYear.month + 1, 1, 12, 0, 0);
          state.historyMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'toggle-habit-today': {
          const habitId = btn.getAttribute('data-habit-id');
          await toggleHabitCompletion(habitId, state.todayStr);
          break;
        }
        case 'toggle-habit-date': {
          const habitId = btn.getAttribute('data-habit-id');
          const dateStr = btn.getAttribute('data-date');
          if (compareDateStrings(dateStr, state.todayStr) <= 0) {
            await toggleHabitCompletion(habitId, dateStr);
          }
          break;
        }
        case 'open-add-habit': {
          openHabitModal(null);
          break;
        }
        case 'edit-habit': {
          const habitId = btn.getAttribute('data-habit-id');
          const habit = state.habits.find((h) => h.id === habitId);
          if (habit) openHabitModal(habit);
          break;
        }
        case 'edit-habit-from-detail': {
          const habitId = btn.getAttribute('data-habit-id');
          const habit = state.habits.find((h) => h.id === habitId);
          state.detailHabitId = null;
          if (habit) openHabitModal(habit);
          break;
        }
        case 'close-habit-modal': {
          state.habitModalOpen = false;
          state.habitForm = null;
          renderApp();
          break;
        }
        case 'save-habit-modal': {
          await saveHabitFromModal();
          break;
        }
        case 'apply-starter-suggestion': {
          const idx = Number(btn.getAttribute('data-index'));
          const s = STARTER_SUGGESTIONS[idx];
          if (s && state.habitForm) {
            state.habitForm.name = s.name;
            state.habitForm.scheduleType = s.schedule.type;
            if (s.schedule.daysOfWeek) state.habitForm.daysOfWeek = [...s.schedule.daysOfWeek];
            if (s.schedule.timesPerWeek) state.habitForm.timesPerWeek = s.schedule.timesPerWeek;
            state.habitForm.executionTime = s.executionTime || '';
            state.habitForm.reminderTime = s.executionTime || '08:00';
            state.habitForm.note = s.note || '';
            state.habitForm.error = null;
            renderApp();
          }
          break;
        }
        case 'hm-set-schedule-type': {
          if (state.habitForm) {
            state.habitForm.scheduleType = btn.getAttribute('data-type');
            renderApp();
          }
          break;
        }
        case 'hm-toggle-day': {
          if (state.habitForm) {
            const d = Number(btn.getAttribute('data-day'));
            const exists = state.habitForm.daysOfWeek.includes(d);
            state.habitForm.daysOfWeek = exists
              ? state.habitForm.daysOfWeek.filter((x) => x !== d)
              : [...state.habitForm.daysOfWeek, d];
            renderApp();
          }
          break;
        }
        case 'hm-set-times-week': {
          if (state.habitForm) {
            state.habitForm.timesPerWeek = Number(btn.getAttribute('data-count'));
            renderApp();
          }
          break;
        }
        case 'hm-toggle-important': {
          if (state.habitForm) {
            state.habitForm.important = !state.habitForm.important;
            renderApp();
          }
          break;
        }
        case 'hm-toggle-reminder': {
          if (state.habitForm) {
            const nextState = !state.habitForm.reminderEnabled;
            if (!nextState) {
              state.habitForm.reminderEnabled = false;
              state.habitForm.reminderInfo = null;
              renderApp();
            } else {
              const perm = await requestNotificationPermissionInteractive();
              state.habitForm.reminderInfo = perm.message;
              state.habitForm.reminderEnabled = perm.granted;
              renderApp();
            }
          }
          break;
        }
        case 'hm-toggle-pause': {
          if (state.habitForm) {
            state.habitForm.status = state.habitForm.status === 'paused' ? 'active' : 'paused';
            renderApp();
          }
          break;
        }
        case 'hm-toggle-archive': {
          if (state.habitForm) {
            state.habitForm.status = state.habitForm.status === 'archived' ? 'active' : 'archived';
            renderApp();
          }
          break;
        }
        case 'hm-ask-delete': {
          if (state.habitForm) {
            state.habitForm.confirmDelete = true;
            renderApp();
          }
          break;
        }
        case 'hm-cancel-delete': {
          if (state.habitForm) {
            state.habitForm.confirmDelete = false;
            renderApp();
          }
          break;
        }
        case 'hm-confirm-delete': {
          const habitId = btn.getAttribute('data-habit-id') || state.habitForm?.id;
          if (habitId) {
            await deleteHabitConfirmed(habitId);
          }
          break;
        }
        case 'inline-ask-delete-habit': {
          state.inlineDeleteHabitId = btn.getAttribute('data-habit-id');
          renderApp();
          break;
        }
        case 'inline-cancel-delete-habit': {
          state.inlineDeleteHabitId = null;
          renderApp();
          break;
        }
        case 'inline-confirm-delete-habit': {
          const habitId = btn.getAttribute('data-habit-id') || state.inlineDeleteHabitId;
          if (habitId) {
            await deleteHabitConfirmed(habitId);
          }
          break;
        }
        case 'detail-ask-delete': {
          state.detailConfirmDelete = true;
          renderApp();
          break;
        }
        case 'detail-cancel-delete': {
          state.detailConfirmDelete = false;
          renderApp();
          break;
        }
        case 'detail-confirm-delete': {
          const habitId = btn.getAttribute('data-habit-id') || state.detailHabitId;
          if (habitId) {
            await deleteHabitConfirmed(habitId);
          }
          break;
        }
        case 'open-period-modal': {
          openPeriodModal(state.activeTab === 'planner' ? state.plannerSelectedDate : state.todayStr);
          break;
        }
        case 'close-period-modal': {
          state.periodModalOpen = false;
          state.periodForm = null;
          renderApp();
          break;
        }
        case 'save-period-modal': {
          await savePeriodFromModal();
          break;
        }
        case 'apply-period-suggestion': {
          const idx = Number(btn.getAttribute('data-index'));
          const sug = PERIOD_SUGGESTIONS[idx];
          if (sug && state.periodForm) {
            state.periodForm.name = sug.name;
            state.periodForm.color = sug.color;
            state.periodForm.error = null;
            renderApp();
          }
          break;
        }
        case 'pm-set-color': {
          if (state.periodForm) {
            state.periodForm.color = btn.getAttribute('data-color');
            renderApp();
          }
          break;
        }
        case 'delete-period': {
          const periodId = btn.getAttribute('data-period-id');
          await deletePeriodById(periodId);
          break;
        }
        case 'open-habit-detail': {
          const habitId = btn.getAttribute('data-habit-id');
          const d = parseLocalDate(state.todayStr);
          state.detailHabitId = habitId;
          state.detailConfirmDelete = false;
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'close-habit-detail': {
          state.detailHabitId = null;
          state.detailConfirmDelete = false;
          renderApp();
          break;
        }
        case 'close-habit-detail': {
          state.detailHabitId = null;
          renderApp();
          break;
        }
        case 'detail-prev-month': {
          const d = new Date(state.detailMonthYear.year, state.detailMonthYear.month - 1, 1, 12, 0, 0);
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'detail-next-month': {
          const d = new Date(state.detailMonthYear.year, state.detailMonthYear.month + 1, 1, 12, 0, 0);
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'planner-prev-month': {
          const d = new Date(state.plannerMonthYear.year, state.plannerMonthYear.month - 1, 1, 12, 0, 0);
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'planner-next-month': {
          const d = new Date(state.plannerMonthYear.year, state.plannerMonthYear.month + 1, 1, 12, 0, 0);
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'planner-select-date': {
          state.plannerSelectedDate = btn.getAttribute('data-date');
          renderApp();
          break;
        }
        case 'planner-jump-today': {
          const d = parseLocalDate(state.todayStr);
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          state.plannerSelectedDate = state.todayStr;
          renderApp();
          break;
        }
        case 'set-planner-mode': {
          state.plannerMode = btn.getAttribute('data-mode');
          renderApp();
          break;
        }
        case 'open-planner-form': {
          openPlannerEntryForm(null, 'morning');
          break;
        }
        case 'open-planner-form-period': {
          const period = btn.getAttribute('data-period');
          openPlannerEntryForm(null, period);
          break;
        }
        case 'close-planner-form': {
          state.plannerFormOpen = false;
          state.plannerForm = null;
          renderApp();
          break;
        }
        case 'pf-set-period': {
          if (state.plannerForm) {
            state.plannerForm.timeOfDay = btn.getAttribute('data-period');
            renderApp();
          }
          break;
        }
        case 'toggle-planner-done': {
          const entryId = btn.getAttribute('data-entry-id');
          await togglePlannerEntryDone(entryId);
          break;
        }
        case 'edit-planner-entry': {
          const entryId = btn.getAttribute('data-entry-id');
          const entry = state.plannerEntries.find((e) => e.id === entryId);
          if (entry) openPlannerEntryForm(entry);
          break;
        }
        case 'delete-planner-entry': {
          const entryId = btn.getAttribute('data-entry-id');
          await removePlannerEntry(entryId);
          break;
        }
        case 'move-planner-entry': {
          const entryId = btn.getAttribute('data-entry-id');
          const dir = Number(btn.getAttribute('data-dir'));
          await movePlannerEntryOrder(entryId, dir);
          break;
        }
        case 'set-theme': {
          const theme = btn.getAttribute('data-theme');
          await updateSettings({ theme });
          break;
        }
        case 'set-week-start': {
          const weekStartsOn = Number(btn.getAttribute('data-day'));
          await updateSettings({ weekStartsOn });
          break;
        }
        case 'request-notifications': {
          const res = await requestNotificationPermissionInteractive();
          await updateSettings({ notificationsEnabled: res.granted });
          showToast(res.message, res.granted ? 'success' : 'info');
          break;
        }
        case 'test-notification': {
          const ok = await sendImmediateNotification(
            'Rutyna – test powiadomień',
            'Powiadomienia lokalne działają poprawnie na tym urządzeniu.'
          );
          showToast(
            ok
              ? 'Wysłano testowe powiadomienie.'
              : 'Nie udało się wysłać powiadomienia. Sprawdź ustawienia systemu.',
            ok ? 'success' : 'error'
          );
          break;
        }
        case 'export-backup': {
          const payload = {
            schemaVersion: DB_VERSION,
            exportedAt: new Date().toISOString(),
            app: 'Rutyna',
            habits: state.habits,
            completions: state.completions,
            plannerEntries: state.plannerEntries,
            periods: state.periods,
            settings: state.settings
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `rutyna-kopia-${state.todayStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Wyeksportowano kopię zapasową JSON.', 'success');
          break;
        }
        case 'export-csv-habits': {
          exportHabitsAndHistoryToCSV();
          showToast('Pobrano plik CSV z nawykami i historią.', 'success');
          break;
        }
        case 'export-csv-planner': {
          exportPlannerToCSV();
          showToast('Pobrano plik CSV z wpisami planera.', 'success');
          break;
        }
        case 'trigger-import-backup': {
          const fileInput = document.getElementById('backup-file-input');
          if (fileInput) fileInput.click();
          break;
        }
        case 'cancel-import-backup': {
          state.pendingBackupImport = null;
          renderApp();
          break;
        }
        case 'confirm-import-backup': {
          if (state.pendingBackupImport) {
            await dbRestoreBackup(state.pendingBackupImport);
            state.pendingBackupImport = null;
            await loadAllDataFromDB();
            showToast('Dane zostały pomyślnie odtworzone z kopii zapasowej.', 'success');
          }
          break;
        }
        case 'ask-clear-all-data': {
          state.confirmClearAllData = true;
          renderApp();
          break;
        }
        case 'cancel-clear-all-data': {
          state.confirmClearAllData = false;
          renderApp();
          break;
        }
        case 'confirm-clear-all-data': {
          try {
            await dbClearAllData();
            state.habits = [];
            state.completions = [];
            state.plannerEntries = [];
            state.periods = [];
            state.settings = { ...DEFAULT_SETTINGS };
            state.confirmClearAllData = false;
            state.inlineDeleteHabitId = null;
            state.pendingBackupImport = null;
            state.detailHabitId = null;
            applyTheme(state.settings.theme);
            showToast('Wszystkie dane zostały trwale wyczyszczone.', 'info');
            renderApp();
          } catch {
            showToast('Wystąpił błąd podczas czyszczenia bazy danych.', 'error');
          }
          break;
        }
        case 'run-unit-tests': {
          state.unitTestResults = runBuiltInUnitTests();
          renderApp();
          break;
        }
        case 'hide-unit-tests': {
          state.unitTestResults = null;
          renderApp();
          break;
        }
      }
    });

    document.addEventListener('submit', async (e) => {
      if (e.target && e.target.id === 'planner-entry-form') {
        e.preventDefault();
        syncPlannerFormInputs();
        await savePlannerEntryFromForm();
      }
    });

    document.getElementById('backup-file-input')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        state.pendingBackupImport = validateBackupPayload(parsed);
        renderApp();
      } catch (err) {
        showToast(
          err instanceof Error ? err.message : 'Plik nie jest poprawną kopią zapasową Rutyna.',
          'error'
        );
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.settings.theme === 'system') {
        applyTheme('system');
      }
    });

    // Inicjalizacja przy starcie
    window.addEventListener('DOMContentLoaded', () => {
      preventIOSPinchAndDoubleTapZoom();
      setupSingleFilePWA();
      loadAllDataFromDB();
      startReminderLoop();
    });

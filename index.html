                    state.historyMode === 'month'
                      ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-sm'
                      : 'text-zinc-600 dark:text-zinc-400'
                  }"
                >
                  Miesiąc
                </button>
              </div>
            </div>
          </header>
        `;
      }

      if (state.activeTab === 'today') {
        const summary = getDailyAggregateSummary(todayStr, todayStr, state.habits, completionMap, weekStartsOn);
        const total = summary.scheduledCount;
        const done = summary.completedCount;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        return `
          <header class="sticky top-0 z-40 bg-[#F4F4F7]/90 dark:bg-[#0B0B0E]/90 backdrop-blur-md border-b border-zinc-200/70 dark:border-zinc-800/80 safe-sticky-header pb-2.5 px-4">
            <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-base font-bold tracking-tight">Dzisiaj</span>
                  ${
                    total > 0
                      ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                          done === total
                            ? 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300'
                            : 'bg-blue-50 dark:bg-blue-950/70 text-[#007AFF]'
                        }">
                          <span class="w-1.5 h-1.5 rounded-full ${done === total ? 'bg-[#28CD41]' : 'bg-[#007AFF]'}"></span>
                          ${done}/${total} • ${pct}%
                        </span>`
                      : ''
                  }
                </div>
                <p class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">
                  ${escapeHtml(formatPolishFullDate(todayStr))}
                </p>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                ${
                  state.habits.length > 0
                    ? `<button type="button" data-action="open-overall-history" class="flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-white dark:bg-[#16161B] border border-zinc-200/80 dark:border-zinc-800 text-xs font-medium text-zinc-700 dark:text-zinc-200 shadow-sm active:scale-95 transition">
                        <svg class="w-3.5 h-3.5 text-[#007AFF]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 16v-4m4 4V8m4 8v-6m4 6V5" />
                        </svg>
                        <span>Historia</span>
                      </button>`
                    : ''
                }
                <button type="button" data-action="open-add-habit" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#007AFF] text-white text-xs font-semibold shadow-sm active:scale-95 transition">
                  <span>+ Nawyk</span>
                </button>
              </div>
            </div>
          </header>
        `;
      }

      if (state.activeTab === 'planner') {
        const selectedDateStr = state.plannerSelectedDate;
        return `
          <header class="sticky top-0 z-40 bg-[#F4F4F7]/90 dark:bg-[#0B0B0E]/90 backdrop-blur-md border-b border-zinc-200/70 dark:border-zinc-800/80 safe-sticky-header pb-2.5 px-4">
            <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-base font-bold tracking-tight">Planer</span>
                  <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-zinc-200/80 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">
                    ${formatShortDayMonth(selectedDateStr)}
                  </span>
                </div>
                <p class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">
                  ${escapeHtml(formatPolishFullDate(selectedDateStr))}
                </p>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                ${
                  selectedDateStr !== todayStr
                    ? `<button type="button" data-action="planner-jump-today" class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-[#16161B] border border-zinc-200/80 dark:border-zinc-800 text-[#007AFF] shadow-sm">
                        Dziś
                      </button>`
                    : ''
                }
                <button type="button" data-action="open-period-modal" class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-400/40">
                  + Okres
                </button>
                <button type="button" data-action="open-planner-form" class="px-3 py-1.5 rounded-full bg-[#007AFF] text-white text-xs font-semibold shadow-sm">
                  + Wpis
                </button>
              </div>
            </div>
          </header>
        `;
      }

      // Zakładka Ustawienia
      const activeCount = state.habits.filter((h) => h.status === 'active').length;
      return `
        <header class="sticky top-0 z-40 bg-[#F4F4F7]/90 dark:bg-[#0B0B0E]/90 backdrop-blur-md border-b border-zinc-200/70 dark:border-zinc-800/80 safe-sticky-header pb-2.5 px-4">
          <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-bold tracking-tight">Ustawienia</span>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-zinc-200/80 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">
                  Aktywne nawyki: ${activeCount}
                </span>
              </div>
              <p class="text-[11px] text-zinc-500 dark:text-zinc-400">
                Preferencje, zarządzanie nawykami i kopie zapasowe
              </p>
            </div>

            <button type="button" data-action="open-add-habit" class="px-3 py-1.5 rounded-full bg-[#007AFF] text-white text-xs font-semibold shadow-sm shrink-0">
              + Nawyk
            </button>
          </div>
        </header>
      `;
    }

    function renderTodayView(completionMap) {
      const todayStr = state.todayStr;
      const weekStartsOn = state.settings.weekStartsOn;
      const activeHabits = state.habits.filter((h) => h.status === 'active');
      const summary = getDailyAggregateSummary(todayStr, todayStr, state.habits, completionMap, weekStartsOn);

      const totalScheduled = summary.scheduledCount;
      const completedCount = summary.completedCount;
      const remainingCount = Math.max(0, totalScheduled - completedCount);
      const progressPercent = totalScheduled > 0 ? Math.round((completedCount / totalScheduled) * 100) : 0;

      const radius = 24;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (progressPercent / 100) * circumference;

      const unscheduledTodayHabits = activeHabits.filter(
        (h) => !summary.scheduledHabits.some((s) => s.habit.id === h.id)
      );

      let remainingLabel = 'Wszystkie zaplanowane nawyki na dziś wykonane';
      if (remainingCount === 1) remainingLabel = 'Pozostał 1 nawyk';
      else if (remainingCount >= 2 && remainingCount <= 4) remainingLabel = `Pozostały ${remainingCount} nawyki`;
      else if (remainingCount >= 5) remainingLabel = `Pozostało ${remainingCount} nawyków`;

      const activePeriodBanner = renderActivePeriodsBanner(todayStr);

      return `
        <div class="space-y-5 pt-2">
          ${activePeriodBanner}

          ${
            activeHabits.length === 0
              ? `
            <!-- PUSTY STAN APLIKACJI -->
            <section aria-label="Brak nawyków" class="rounded-3xl bg-white dark:bg-[#16161B] border border-zinc-200/80 dark:border-zinc-800/90 p-8 text-center space-y-5 shadow-sm my-3">
              <div class="mx-auto w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/50 flex items-center justify-center">
                <svg viewBox="0 0 64 64" class="w-9 h-9 text-[#007AFF]" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="4" stroke-opacity="0.25" />
                  <path d="M32 8 A24 24 0 1 1 13 46" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
                  <path d="M22 33 L29 40 L43 24" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <div class="space-y-2 max-w-xs mx-auto">
                <h2 class="text-lg font-semibold tracking-tight">Zacznij od jednej rzeczy</h2>
                <p class="text-sm text-zinc-500 dark:text-zinc-400 leading-relaxed">
                  Małe, regularne kroki budują trwałą rutynę. Dodaj swój pierwszy nawyk, aby śledzić codzienny postęp jednym dotknięciem.
                </p>
              </div>
              <button type="button" data-action="open-add-habit" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-[#007AFF] text-white text-sm font-semibold shadow-sm hover:opacity-95 active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                <span>Dodaj pierwszy nawyk</span>
              </button>
            </section>
          `
              : `
            <!-- KOMPAKTOWE PODSUMOWANIE DNIA -->
            <section aria-label="Podsumowanie dnia" class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800/80 px-5 py-4 flex items-center justify-between shadow-sm">
              <div class="space-y-0.5">
                <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Twój dzień</span>
                ${
                  totalScheduled === 0
                    ? `<p class="text-base font-semibold">Dzień bez zaplanowanych nawyków</p>
                       <p class="text-xs text-zinc-500 dark:text-zinc-400">Wszystkie Twoje nawyki przypadają na inne dni tygodnia.</p>`
                    : `<p class="text-lg font-semibold">${completedCount} z ${totalScheduled} wykonane</p>
                       <p class="text-xs text-zinc-500 dark:text-zinc-400">${remainingLabel}</p>`
                }
              </div>

              ${
                totalScheduled > 0
                  ? `<div class="relative w-14 h-14 flex items-center justify-center shrink-0">
                      <svg class="w-14 h-14 -rotate-90" viewBox="0 0 56 56">
                        <circle cx="28" cy="28" r="${radius}" fill="none" stroke="currentColor" stroke-width="5" class="text-zinc-100 dark:text-zinc-800" />
                        <circle
                          cx="28"
                          cy="28"
                          r="${radius}"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="5"
                          stroke-linecap="round"
                          stroke-dasharray="${circumference}"
                          stroke-dashoffset="${strokeDashoffset}"
                          class="transition-all duration-300 ${completedCount === totalScheduled ? 'text-[#28CD41]' : 'text-[#007AFF]'}"
                        />
                      </svg>
                      <span class="absolute text-xs font-semibold">${progressPercent}%</span>
                    </div>`
                  : ''
              }
            </section>

            <!-- LISTA NAWYKÓW ZAPLANOWANYCH NA DZIŚ -->
            ${
              summary.scheduledHabits.length > 0
                ? `<section aria-label="Nawyki na dzisiaj" class="space-y-2">
                    <div class="flex items-center justify-between px-1">
                      <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Zaplanowane na dziś</h2>
                      <span class="text-xs text-zinc-400 dark:text-zinc-500">Dotknij kółka, aby wykonać</span>
                    </div>

                    <div class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800/80 divide-y divide-zinc-100 dark:divide-zinc-800/80 shadow-sm overflow-hidden">
                      ${summary.scheduledHabits
                        .map(({ habit, completed }) => {
                          const needsAttention = shouldShowNeverMissTwiceAlert(habit, todayStr, completionMap, weekStartsOn);
                          const displayTime = habit.executionTime || (habit.reminder?.enabled ? habit.reminder.time : '');
                          const isPop = state.justToggledHabitId === habit.id;

                          let btnClasses =
                            'border-2 border-zinc-300 dark:border-zinc-600 text-transparent hover:border-zinc-400';
                          if (completed) {
                            btnClasses = 'bg-[#28CD41] border-2 border-[#28CD41] text-white shadow-sm';
                          } else if (needsAttention) {
                            btnClasses = 'border-2 border-[#FF3B30] text-transparent hover:bg-red-50 dark:hover:bg-red-950/30';
                          } else if (habit.important) {
                            btnClasses = 'border-2 border-[#007AFF] text-transparent hover:bg-blue-50/50 dark:hover:bg-blue-950/30';
                          }

                          return `
                            <div class="flex items-center gap-3.5 px-4 py-3.5 transition-colors ${needsAttention ? 'bg-red-50/40 dark:bg-red-950/15' : ''}">
                              <button
                                type="button"
                                role="checkbox"
                                aria-checked="${completed}"
                                aria-label="Oznacz nawyk ${escapeHtml(habit.name)}"
                                data-action="toggle-habit-today"
                                data-habit-id="${escapeHtml(habit.id)}"
                                class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 transition-transform active:scale-90 ${isPop ? 'animate-check-pop' : ''} ${btnClasses}"
                              >
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                              </button>

                              <button
                                type="button"
                                data-action="open-habit-detail"
                                data-habit-id="${escapeHtml(habit.id)}"
                                class="flex-1 min-w-0 text-left focus:outline-none"
                              >
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span class="text-[15px] font-medium leading-snug ${completed ? 'line-through text-zinc-400 dark:text-zinc-500' : 'text-zinc-900 dark:text-zinc-100'}">
                                    ${escapeHtml(habit.name)}
                                  </span>
                                  ${
                                    habit.important && !completed
                                      ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] font-semibold bg-blue-50 dark:bg-blue-950/60 text-[#007AFF]">Ważny</span>`
                                      : ''
                                  }
                                </div>

                                <div class="flex items-center gap-3 mt-0.5 flex-wrap">
                                  ${
                                    displayTime
                                      ? `<span class="inline-flex items-center gap-1 text-xs text-zinc-500 dark:text-zinc-400">
                                          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                          </svg>
                                          ${escapeHtml(displayTime)}
                                        </span>`
                                      : ''
                                  }
                                  ${
                                    habit.note
                                      ? `<span class="text-xs text-zinc-400 dark:text-zinc-500 truncate max-w-[200px]">${escapeHtml(habit.note)}</span>`
                                      : ''
                                  }
                                  ${
                                    needsAttention
                                      ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-[#FF3B30]">
                                          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                          </svg>
                                          Nie przerywaj rytmu
                                        </span>`
                                      : ''
                                  }
                                </div>
                              </button>

                              <button
                                type="button"
                                data-action="open-habit-detail"
                                data-habit-id="${escapeHtml(habit.id)}"
                                aria-label="Historia nawyku ${escapeHtml(habit.name)}"
                                class="p-1.5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 rounded-lg"
                              >
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                                </svg>
                              </button>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                  </section>`
                : ''
            }

            <!-- NAWYKI POZA DZISIEJSZYM HARMONOGRAMEM -->
            ${
              unscheduledTodayHabits.length > 0
                ? `<section aria-label="Nawyki w inne dni" class="space-y-2 pt-1">
                    <h2 class="px-1 text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">
                      Poza dzisiejszym harmonogramem
                    </h2>
                    <div class="rounded-2xl bg-white/75 dark:bg-[#16161B]/60 border border-zinc-200/50 dark:border-zinc-800/60 divide-y divide-zinc-100 dark:divide-zinc-800/60">
                      ${unscheduledTodayHabits
                        .map(
                          (h) => `
                        <button
                          type="button"
                          data-action="open-habit-detail"
                          data-habit-id="${escapeHtml(h.id)}"
                          class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-zinc-50 dark:hover:bg-zinc-800/40 transition-colors"
                        >
                          <div>
                            <p class="text-sm font-medium text-zinc-600 dark:text-zinc-300">${escapeHtml(h.name)}</p>
                            <p class="text-xs text-zinc-400 dark:text-zinc-500">${escapeHtml(formatScheduleLabel(h.schedule))}</p>
                          </div>
                          <svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                          </svg>
                        </button>
                      `
                        )
                        .join('')}
                    </div>
                  </section>`
                : ''
            }
          `
          }
        </div>
      `;
    }

    function getHistoryCellColorClass(summary) {
      if (summary.isFuture) {
        return 'bg-zinc-100/50 dark:bg-zinc-900/40 border border-dashed border-zinc-200 dark:border-zinc-800';
      }
      if (summary.scheduledCount === 0 || summary.completionRatio === null) {
        return 'bg-zinc-100 dark:bg-zinc-800/60';
      }
      if (summary.completionRatio === 0) {
        return 'bg-zinc-200/85 dark:bg-zinc-800';
      }
      if (summary.completionRatio < 0.4) {
        return 'bg-emerald-200 dark:bg-emerald-900/70';
      }
      if (summary.completionRatio < 0.8) {
        return 'bg-emerald-400 dark:bg-emerald-600';
      }
      return 'bg-[#28CD41] dark:bg-emerald-500';
    }

    function renderOverallHistoryView(completionMap) {
      const todayStr = state.todayStr;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedWeekDays = getOrderedWeekDays(weekStartsOn);

      const endWeekStart = getStartOfWeek(todayStr, weekStartsOn);
      const totalWeeks = 52;
      const firstWeekStart = addDays(endWeekStart, -(totalWeeks - 1) * 7);
      const yearlyWeeks = [];
      for (let w = 0; w < totalWeeks; w++) {
        const wStart = addDays(firstWeekStart, w * 7);
        const days = [];
        for (let d = 0; d < 7; d++) {
          const dateStr = addDays(wStart, d);
          days.push(getDailyAggregateSummary(dateStr, todayStr, state.habits, completionMap, weekStartsOn));
        }
        yearlyWeeks.push(days);
      }

      const rawCells = getCalendarGridDays(
        state.historyMonthYear.year,
        state.historyMonthYear.month,
        weekStartsOn
      );
      const monthlyCells = rawCells.map((cell) => ({
        ...cell,
        summary: getDailyAggregateSummary(cell.dateStr, todayStr, state.habits, completionMap, weekStartsOn)
      }));

      const selectedSummary = getDailyAggregateSummary(
        state.historySelectedDate,
        todayStr,
        state.habits,
        completionMap,
        weekStartsOn
      );

      return `
        <div class="space-y-5">
          <header class="flex items-center justify-between pt-2">
            <button type="button" data-action="close-overall-history" class="inline-flex items-center gap-1.5 text-sm font-medium text-[#007AFF] py-1.5 pr-3 rounded-xl">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
              <span>Powrót do Dzisiaj</span>
            </button>

            <div class="inline-flex p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-800">
              <button
                type="button"
                data-action="set-history-mode"
                data-mode="year"
                class="px-3 py-1 rounded-lg text-xs font-medium ${
                  state.historyMode === 'year'
                    ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-sm'
                    : 'text-zinc-600 dark:text-zinc-400'
                }"
              >
                Rok
              </button>
              <button
                type="button"
                data-action="set-history-mode"
                data-mode="month"
                class="px-3 py-1 rounded-lg text-xs font-medium ${
                  state.historyMode === 'month'
                    ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-sm'
                    : 'text-zinc-600 dark:text-zinc-400'
                }"
              >
                Miesiąc
              </button>
            </div>
          </header>

          <div>
            <h1 class="text-xl font-bold tracking-tight">Historia ogólna</h1>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">
              Intensywność koloru odzwierciedla procent realizacji nawyków zaplanowanych na dany dzień.
            </p>
          </div>

          ${
            state.historyMode === 'year'
              ? `
            <section class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 p-4 space-y-3 shadow-sm">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-zinc-600 dark:text-zinc-300">Ostatnie 52 tygodnie</span>
                <span class="text-[11px] text-zinc-400">Dotknij kratki, aby zobaczyć dzień</span>
              </div>

              <div class="overflow-x-auto custom-scrollbar pb-2">
                <div class="inline-flex gap-1 min-w-full justify-end">
                  ${yearlyWeeks
                    .map(
                      (week) => `
                    <div class="flex flex-col gap-1">
                      ${week
                        .map((daySum) => {
                          const isSelected = daySum.dateStr === state.historySelectedDate;
                          const ringClass = daySum.isToday
                            ? 'ring-2 ring-[#007AFF] ring-offset-1 dark:ring-offset-[#16161B]'
                            : isSelected
                            ? 'ring-2 ring-zinc-900 dark:ring-white'
                            : '';
                          return `<button
                            type="button"
                            data-action="select-history-date"
                            data-date="${daySum.dateStr}"
                            title="${daySum.dateStr}"
                            aria-label="Dzień ${daySum.dateStr}"
                            class="w-3.5 h-3.5 rounded-[3px] ${getHistoryCellColorClass(daySum)} ${ringClass}"
                          ></button>`;
                        })
                        .join('')}
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-zinc-100 dark:border-zinc-800/80 text-[11px] text-zinc-500 dark:text-zinc-400">
                <div class="flex items-center gap-1.5">
                  <span class="w-3 h-3 rounded-[3px] bg-zinc-100 dark:bg-zinc-800/60 inline-block"></span>
                  <span>Brak planu (neutralny)</span>
                </div>
                <div class="flex items-center gap-1">
                  <span>0%</span>
                  <span class="w-3 h-3 rounded-[3px] bg-zinc-200/85 dark:bg-zinc-800 inline-block"></span>
                  <span class="w-3 h-3 rounded-[3px] bg-emerald-200 dark:bg-emerald-900/70 inline-block"></span>
                  <span class="w-3 h-3 rounded-[3px] bg-emerald-400 dark:bg-emerald-600 inline-block"></span>
                  <span class="w-3 h-3 rounded-[3px] bg-[#28CD41] dark:bg-emerald-500 inline-block"></span>
                  <span>100%</span>
                </div>
              </div>
            </section>
          `
              : `
            <section class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 p-4 space-y-4 shadow-sm">
              <div class="flex items-center justify-between">
                <button type="button" data-action="history-prev-month" aria-label="Poprzedni miesiąc" class="p-2 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <h2 class="text-sm font-semibold">
                  ${escapeHtml(formatPolishMonthYear(state.historyMonthYear.year, state.historyMonthYear.month))}
                </h2>
                <button type="button" data-action="history-next-month" aria-label="Następny miesiąc" class="p-2 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>

              <div class="grid grid-cols-7 gap-y-1.5 text-center">
                ${orderedWeekDays
                  .map(
                    (d) => `<div class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500 py-1">${d.label}</div>`
                  )
                  .join('')}
                ${monthlyCells
                  .map(({ dateStr, inCurrentMonth, summary }) => {
                    const dayNum = Number(dateStr.split('-')[2]);
                    const isSelected = dateStr === state.historySelectedDate;
                    const ribbon = getPeriodRibbonInfo(dateStr);
                    const ringClass = summary.isToday
                      ? 'ring-2 ring-[#007AFF]'
                      : isSelected
                      ? 'ring-2 ring-zinc-900 dark:ring-white'
                      : '';
                    return `
                      <div class="relative py-0.5 px-0.5 ${ribbon ? `${ribbon.meta.ribbonBg} ${ribbon.radiusClass}` : ''}">
                        ${
                          ribbon
                            ? `<span class="absolute top-0.5 inset-x-1 h-1 rounded-full ${ribbon.meta.bar} opacity-80" title="${escapeHtml(ribbon.period.name)}"></span>`
                            : ''
                        }
                        <button
                          type="button"
                          data-action="select-history-date"
                          data-date="${dateStr}"
                          title="${ribbon ? `${dateStr} • ${escapeHtml(ribbon.period.name)}` : dateStr}"
                          class="w-full h-10 rounded-xl flex items-center justify-center text-xs font-medium ${!inCurrentMonth ? 'opacity-30' : ''} ${getHistoryCellColorClass(summary)} ${ringClass}"
                        >
                          ${dayNum}
                        </button>
                      </div>
                    `;
                  })
                  .join('')}
              </div>

              ${renderMonthPeriodsList(state.historyMonthYear.year, state.historyMonthYear.month, true)}
            </section>
          `
          }

          <!-- Podsumowanie wybranego dnia w historii -->
          <section class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 p-4 space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-xs font-medium uppercase tracking-wider text-zinc-400">
                  Wybrany dzień ${selectedSummary.isToday ? '(Dzisiaj)' : ''}
                </p>
                <h3 class="text-sm font-semibold">${escapeHtml(formatPolishFullDate(selectedSummary.dateStr))}</h3>
              </div>
              ${
                !selectedSummary.isFuture && selectedSummary.scheduledCount > 0
                  ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-zinc-100 dark:bg-zinc-800">
                      ${selectedSummary.completedCount} / ${selectedSummary.scheduledCount} (${Math.round((selectedSummary.completionRatio || 0) * 100)}%)
                    </span>`
                  : ''
              }
            </div>

            ${renderActivePeriodsBanner(selectedSummary.dateStr)}

            ${
              selectedSummary.isFuture
                ? `<p class="text-xs text-zinc-500 dark:text-zinc-400">To dzień z przyszłości — przyszłe daty nie są oceniane w historii.</p>`
                : selectedSummary.scheduledCount === 0
                ? `<p class="text-xs text-zinc-500 dark:text-zinc-400">Brak zaplanowanych nawyków w tym dniu (dzień neutralny).</p>`
                : `<ul class="divide-y divide-zinc-100 dark:divide-zinc-800/70">
                    ${selectedSummary.scheduledHabits
                      .map(
                        ({ habit, completed }) => `
                      <li class="py-2 flex items-center justify-between text-sm">
                        <button type="button" data-action="open-habit-detail" data-habit-id="${escapeHtml(habit.id)}" class="text-left font-medium hover:text-[#007AFF]">
                          ${escapeHtml(habit.name)}
                        </button>
                        <span class="text-xs font-medium px-2 py-0.5 rounded-full ${
                          completed
                            ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300'
                            : selectedSummary.isToday
                            ? 'bg-blue-50 dark:bg-blue-950/50 text-[#007AFF]'
                            : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-500'
                        }">
                          ${completed ? 'Wykonany' : selectedSummary.isToday ? 'W trakcie dnia' : 'Pominięty'}
                        </span>
                      </li>
                    `
                      )
                      .join('')}
                  </ul>`
            }
          </section>
        </div>
      `;
    }

    function renderPlannerView(completionMap) {
      const todayStr = state.todayStr;
      const selectedDateStr = state.plannerSelectedDate;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedWeekDays = getOrderedWeekDays(weekStartsOn);

      const entriesByDate = new Map();
      for (const entry of state.plannerEntries) {
        const list = entriesByDate.get(entry.date) || [];
        list.push(entry);
        entriesByDate.set(entry.date, list);
      }

      const rawDayEntries = [...(entriesByDate.get(selectedDateStr) || [])];
      const dayEntries =
        state.plannerMode === 'time'
          ? rawDayEntries.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || (a.order || 0) - (b.order || 0))
          : rawDayEntries.sort((a, b) => (a.order || 0) - (b.order || 0));

      const calendarCells = getCalendarGridDays(
        state.plannerMonthYear.year,
        state.plannerMonthYear.month,
        weekStartsOn
      );

      const activeHabits = state.habits.filter((h) => h.status === 'active');
      const periods = [
        { id: 'morning', label: 'Rano', badgeColor: 'text-amber-500' },
        { id: 'afternoon', label: 'Popołudnie', badgeColor: 'text-orange-500' },
        { id: 'evening', label: 'Wieczór', badgeColor: 'text-indigo-500' }
      ];

      return `
        <div class="space-y-5 pt-2">
          <!-- Miesięczny kalendarz planera z obsługą ciągłych okresów (np. wyjazdów) -->
          <section aria-label="Kalendarz miesięczny" class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 p-4 space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
              <button type="button" data-action="planner-prev-month" aria-label="Poprzedni miesiąc" class="p-1.5 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
              </button>
              <h2 class="text-sm font-semibold">
                ${escapeHtml(formatPolishMonthYear(state.plannerMonthYear.year, state.plannerMonthYear.month))}
              </h2>
              <button type="button" data-action="planner-next-month" aria-label="Następny miesiąc" class="p-1.5 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-7 gap-y-1.5 text-center">
              ${orderedWeekDays
                .map((d) => `<div class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500 py-1">${d.label}</div>`)
                .join('')}
              ${calendarCells
                .map(({ dateStr, inCurrentMonth }) => {
                  const dayNum = Number(dateStr.split('-')[2]);
                  const isSelected = dateStr === selectedDateStr;
                  const isToday = dateStr === todayStr;
                  const hasPlannerItems = (entriesByDate.get(dateStr)?.length || 0) > 0;
                  const habitSum = getDailyAggregateSummary(dateStr, todayStr, state.habits, completionMap, weekStartsOn);
                  const allHabitsDone =
                    !habitSum.isFuture &&
                    habitSum.scheduledCount > 0 &&
                    habitSum.completedCount === habitSum.scheduledCount;

                  const ribbon = getPeriodRibbonInfo(dateStr);

                  return `
                    <div class="relative py-0.5 px-0.5 ${ribbon ? `${ribbon.meta.ribbonBg} ${ribbon.radiusClass}` : ''}">
                      ${
                        ribbon
                          ? `<span class="absolute top-0.5 inset-x-1 h-1 rounded-full ${ribbon.meta.bar} opacity-85" title="${escapeHtml(ribbon.period.name)}"></span>`
                          : ''
                      }
                      <button
                        type="button"
                        data-action="planner-select-date"
                        data-date="${dateStr}"
                        title="${ribbon ? `${dateStr} • ${escapeHtml(ribbon.period.name)}` : dateStr}"
                        class="w-full h-11 rounded-xl flex flex-col items-center justify-center relative transition-colors ${
                          !inCurrentMonth ? 'opacity-30' : ''
                        } ${
                          isSelected
                            ? 'bg-[#007AFF] text-white font-semibold shadow-sm'
                            : isToday
                            ? 'bg-blue-50 dark:bg-blue-950/50 text-[#007AFF] font-semibold'
                            : 'hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60'
                        }"
                      >
                        <span class="text-xs">${dayNum}</span>
                        <div class="flex items-center gap-1 mt-0.5 h-1.5">
                          ${
                            hasPlannerItems
                              ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-[#007AFF]'}"></span>`
                              : ''
                          }
                          ${
                            allHabitsDone
                              ? `<span class="w-2 h-1 rounded-full ${isSelected ? 'bg-emerald-200' : 'bg-[#28CD41]'}"></span>`
                              : ''
                          }
                        </div>
                      </button>
                    </div>
                  `;
                })
                .join('')}
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4 pt-1 text-[11px] text-zinc-400">
              <span class="inline-flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#007AFF]"></span>
                Wpisy w planerze
              </span>
              <span class="inline-flex items-center gap-1.5">
                <span class="w-2 h-1 rounded-full bg-[#28CD41]"></span>
                Zrealizowane nawyki
              </span>
              <span class="inline-flex items-center gap-1.5">
                <span class="w-3 h-1.5 rounded-full bg-amber-500"></span>
                Oznaczony okres (np. wyjazd)
              </span>
            </div>

            ${renderMonthPeriodsList(state.plannerMonthYear.year, state.plannerMonthYear.month, true)}
          </section>

          <!-- Sekcja planu wybranego dnia -->
          <section class="space-y-3">
            ${renderActivePeriodsBanner(selectedDateStr)}

            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-semibold">${escapeHtml(formatPolishFullDate(selectedDateStr))}</h2>
                <p class="text-xs text-zinc-500 dark:text-zinc-400">Wpisy planera są niezależne od statystyk nawyków</p>
              </div>

              <div class="flex items-center gap-2">
                <div class="inline-flex p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-800">
                  <button
                    type="button"
                    data-action="set-planner-mode"
                    data-mode="period"
                    class="px-2.5 py-1 rounded-lg text-xs font-medium ${
                      state.plannerMode === 'period'
                        ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-sm'
                        : 'text-zinc-600 dark:text-zinc-400'
                    }"
                  >
                    Pory dnia
                  </button>
                  <button
                    type="button"
                    data-action="set-planner-mode"
                    data-mode="time"
                    class="px-2.5 py-1 rounded-lg text-xs font-medium ${
                      state.plannerMode === 'time'
                        ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-sm'
                        : 'text-zinc-600 dark:text-zinc-400'
                    }"
                  >
                    Godzinowy
                  </button>
                </div>

                <button
                  type="button"
                  data-action="open-planner-form"
                  class="inline-flex items-center gap-1 px-3 py-2 rounded-xl bg-[#007AFF] text-white text-xs font-semibold shadow-sm"
                >
                  <span>+ Dodaj wpis</span>
                </button>
              </div>
            </div>

            ${
              state.plannerFormOpen && state.plannerForm
                ? `
              <form id="planner-entry-form" class="rounded-2xl bg-white dark:bg-[#16161B] border border-blue-200 dark:border-blue-900/60 p-4 space-y-3 shadow-md">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-[#007AFF]">
                    ${state.plannerForm.isEdit ? 'Edytuj wpis planu' : 'Nowy wpis w planie dnia'}
                  </span>
                  <button type="button" data-action="close-planner-form" class="text-xs text-zinc-400 hover:text-zinc-600">
                    Zamknij
                  </button>
                </div>

                <input
                  type="text"
                  id="pf-content"
                  required
                  placeholder="Co planujesz zrobić?"
                  value="${escapeHtml(state.plannerForm.content)}"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-base focus:outline-none focus:ring-2 focus:ring-[#007AFF]"
                />

                <input
                  type="text"
                  id="pf-description"
                  placeholder="Opcjonalny opis lub szczegóły..."
                  value="${escapeHtml(state.plannerForm.description)}"
                  class="w-full px-3.5 py-2 rounded-xl bg-zinc-100/70 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-base focus:outline-none focus:ring-2 focus:ring-[#007AFF]"
                />

                ${
                  state.plannerMode === 'period'
                    ? `<div class="grid grid-cols-3 gap-1.5">
                        ${periods
                          .map(
                            (p) => `
                          <button
                            type="button"
                            data-action="pf-set-period"
                            data-period="${p.id}"
                            class="py-2 rounded-xl text-xs font-medium border ${
                              state.plannerForm.timeOfDay === p.id
                                ? 'bg-blue-50 dark:bg-blue-950/60 border-[#007AFF] text-[#007AFF]'
                                : 'bg-zinc-50 dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400'
                            }"
                          >
                            ${p.label}
                          </button>
                        `
                          )
                          .join('')}
                      </div>`
                    : `<div class="flex items-center justify-between px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
                        <label for="pf-time" class="text-xs font-medium">Godzina (np. 06:00, 15:30):</label>
                        <input
                          id="pf-time"
                          type="time"
                          value="${escapeHtml(state.plannerForm.time)}"
                          class="px-2.5 py-1 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-base"
                        />
                      </div>`
                }

                ${
                  activeHabits.length > 0
                    ? `<div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
                        <label for="pf-linked-habit" class="text-xs text-zinc-500">Powiąż z nawykiem (opcjonalnie):</label>
                        <select
                          id="pf-linked-habit"
                          class="text-base bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg px-2 py-1 max-w-[180px]"
                        >
                          <option value="">Brak powiązania</option>
                          ${activeHabits
                            .map(
                              (h) => `
                            <option value="${escapeHtml(h.id)}" ${state.plannerForm.linkedHabitId === h.id ? 'selected' : ''}>
                              ${escapeHtml(h.name)}
                            </option>
                          `
                            )
                            .join('')}
                        </select>
                      </div>`
                    : ''
                }

                <div class="flex justify-end gap-2 pt-1">
                  <button type="button" data-action="close-planner-form" class="px-4 py-2 rounded-xl text-xs font-medium bg-zinc-100 dark:bg-zinc-800">
                    Anuluj
                  </button>
                  <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-[#007AFF] text-white">
                    ${state.plannerForm.isEdit ? 'Zapisz zmiany' : 'Dodaj do planu'}
                  </button>
                </div>
              </form>
            `
                : ''
            }

            ${
              dayEntries.length === 0
                ? `
              <div class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 p-7 text-center space-y-3">
                <div class="space-y-1">
                  <p class="text-sm font-semibold">Brak wpisów w planie na ten dzień</p>
                  <p class="text-xs text-zinc-500 dark:text-zinc-400 max-w-xs mx-auto">
                    Zaplanuj najważniejsze zadania według pór dnia (Rano, Popołudnie, Wieczór) lub konkretnych godzin.
                  </p>
                </div>
                <button
                  type="button"
                  data-action="open-planner-form"
                  class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200/70 text-xs font-semibold text-[#007AFF]"
                >
                  <span>+ Zaplanuj ten dzień</span>
                </button>
              </div>
            `
                : state.plannerMode === 'period'
                ? `
              <div class="space-y-3">
                ${periods
                  .map((period) => {
                    const items = dayEntries.filter((e) => (e.timeOfDay || 'morning') === period.id);
                    return `
                      <div class="rounded-2xl bg-white dark:bg-[#16161B] border border-zinc-200/70 dark:border-zinc-800 overflow-hidden shadow-sm">
                        <div class="flex items-center justify-between px-4 py-2.5 bg-zinc-50/80 dark:bg-zinc-900/50 border-b border-zinc-100 dark:border-zinc-800/80">
                          <div class="flex items-center gap-2 text-xs font-semibold">
                            <span class="${period.badgeColor}">●</span>
                            <span>${period.label}</span>
                            <span class="text-zinc-400 font-normal">(${items.length})</span>
                          </div>
                          <button
                            type="button"
                            data-action="open-planner-form-period"
                            data-period="${period.id}"
                            class="text-xs font-medium text-[#007AFF] hover:underline"
                          >
                            + Dodaj
                          </button>
                        </div>

                        ${
                          items.length === 0
                            ? `<p class="px-4 py-3 text-xs text-zinc-400 dark:text-zinc-500">Brak wpisów na tę porę dnia.</p>`
                            : `<ul class="divide-y divide-zinc-100 dark:divide-zinc-800/70">
                                ${items
                                  .map((entry, idx) => {
                                    const linkedHabit = state.habits.find((h) => h.id === entry.linkedHabitId);
                                    return `
                                      <li class="px-4 py-3 flex items-start justify-between gap-3">
                                        <button
                                          type="button"
                                          data-action="toggle-planner-done"
                                          data-entry-id="${escapeHtml(entry.id)}"
                                          aria-label="Oznacz wpis planu"
                                          class="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center border shrink-0 ${
                                            entry.done
                                              ? 'bg-[#007AFF] border-[#007AFF] text-white'
                                              : 'border-zinc-300 dark:border-zinc-600'
                                          }"
                                        >
                                          ${entry.done ? '✓' : ''}
                                        </button>

                                        <div class="flex-1 min-w-0">
                                          <p class="text-sm font-medium ${entry.done ? 'line-through text-zinc-400 dark:text-zinc-500' : ''}">
                                            ${escapeHtml(entry.content)}
                                          </p>
                                          ${
                                            entry.description
                                              ? `<p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">${escapeHtml(entry.description)}</p>`
                                              : ''
                                          }
                                          ${
                                            linkedHabit
                                              ? `<span class="inline-flex items-center gap-1 mt-1 text-[11px] px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-950/50 text-[#007AFF]">
                                                  Nawyk: ${escapeHtml(linkedHabit.name)}
                                                </span>`
                                              : ''
                                          }
                                        </div>

                                        <div class="flex items-center gap-1 shrink-0 text-xs">
                                          <button
                                            type="button"
                                            ${idx === 0 ? 'disabled' : ''}
                                            data-action="move-planner-entry"
                                            data-entry-id="${escapeHtml(entry.id)}"
                                            data-dir="-1"
                                            aria-label="Przesuń wyżej"
                                            class="p-1 text-zinc-400 hover:text-zinc-700 disabled:opacity-25"
                                          >↑</button>
                                          <button
                                            type="button"
                                            ${idx === items.length - 1 ? 'disabled' : ''}
                                            data-action="move-planner-entry"
                                            data-entry-id="${escapeHtml(entry.id)}"
                                            data-dir="1"
                                            aria-label="Przesuń niżej"
                                            class="p-1 text-zinc-400 hover:text-zinc-700 disabled:opacity-25"
                                          >↓</button>
                                          <button
                                            type="button"
                                            data-action="edit-planner-entry"
                                            data-entry-id="${escapeHtml(entry.id)}"
                                            aria-label="Edytuj wpis"
                                            class="p-1 text-zinc-400 hover:text-[#007AFF]"
                                          >Edytuj</button>
                                          <button
                                            type="button"
                                            data-action="delete-planner-entry"
                                            data-entry-id="${escapeHtml(entry.id)}"
                                            aria-label="Usuń wpis"
                                            class="p-1 text-zinc-400 hover:text-[#FF3B30]"
                                          >Usuń</button>
                                        </div>
                                      </li>
                                    `;
                                  })
                                  .join('')}

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      /* Blokada pinch-to-zoom przy zachowaniu płynnego przewijania jednym palcem i działania position: sticky */
      touch-action: pan-x pan-y;
      overflow-x: clip;
      user-select: none;
      -webkit-user-select: none;

    /* Elementy formularzy zachowują możliwość zaznaczania tekstu i rozmiar min. 16px (brak auto-zoomu na iOS) */

    /* Subtelny pasek przewijania dla siatki rocznej */

      width: 5px;

    .custom-scrollbar::-webkit-scrollbar-thumb {

<body class="min-h-full bg-[#F4F4F7] dark:bg-[#0B0B0E] text-zinc-900 dark:text-zinc-100 font-sans antialiased selection:bg-[#007AFF]/20">
  <!-- Kontener główny aplikacji -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Ukryty input dla importu kopii zapasowej JSON -->
  <input type="file" id="backup-file-input" accept="application/json,.json" class="hidden" />

  <script>
    /***********************************************************************
     * 0. BLOKADA PRZYBLIŻANIA DWOMA PALCAMI (PINCH-TO-ZOOM) NA iOS SAFARI
     ***********************************************************************/
    function preventIOSPinchAndDoubleTapZoom() {
      // iOS Safari ignoruje sam atrybut user-scalable=no od iOS 10, dlatego blokujemy zdarzenia gestów
      const blockGesture = (e) => {
        e.preventDefault();
      };
      document.addEventListener('gesturestart', blockGesture, { passive: false });
      document.addEventListener('gesturechange', blockGesture, { passive: false });
      document.addEventListener('gestureend', blockGesture, { passive: false });

      // Blokada wielodotyku (2+ palce) podczas ruchu po ekranie, zachowując przewijanie 1 palcem
      document.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        },
        { passive: false }
      );

      // Blokada przybliżania przez szybkie podwójne dotknięcie (double-tap zoom)
      let lastTouchEnd = 0;
      document.addEventListener(
        'touchend',
        (e) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );
    }

    /***********************************************************************
     * 1. KONFIGURACJA PWA (DYNAMICZNY MANIFEST + SERVICE WORKER OFFLINE)
     ***********************************************************************/
    const ICON_SVG_DATA_URI =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%23007AFF'/%3E%3Ccircle cx='256' cy='256' r='144' fill='none' stroke='%23FFFFFF' stroke-width='28' stroke-opacity='0.28'/%3E%3Cpath d='M256 112 A144 144 0 1 1 134 332' fill='none' stroke='%23FFFFFF' stroke-width='28' stroke-linecap='round'/%3E%3Cpath d='M196 260 L238 302 L324 210' fill='none' stroke='%23FFFFFF' stroke-width='32' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";

    function setupSingleFilePWA() {
      try {
        const startUrl = window.location.href.split('#')[0];
        const manifestObj = {
          name: 'Rutyna',
          short_name: 'Rutyna',
          description: 'Osobista aplikacja do śledzenia nawyków, planowania dnia i obserwowania postępu.',
          lang: 'pl-PL',
          start_url: startUrl,
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#F4F4F7',
          theme_color: '#007AFF',
          icons: [
            {
              src: ICON_SVG_DATA_URI,
              sizes: '192x192 512x512',
              type: 'image/svg+xml',
              purpose: 'any maskable'
            }
          ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const linkEl = document.getElementById('pwa-manifest-link');
        if (linkEl) linkEl.setAttribute('href', manifestUrl);
      } catch (e) {
        console.warn('Nie udało się wygenerować dynamicznego manifestu:', e);
      }

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // Brak osobnego pliku sw.js w repozytorium nie blokuje działania aplikacji
        });
      }
    }

    /***********************************************************************
     * 2. WARSTWA DAT LOKALNYCH (ODPORNA NA STREFY CZASOWE I DST)
     ***********************************************************************/
    function toLocalDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = String(dateStr).split('-').map(Number);
      return new Date(y || 2026, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }

    function addDays(dateStr, days) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + days);
      return toLocalDateString(d);
    }

    function compareDateStrings(a, b) {
      if (a === b) return 0;
      return a < b ? -1 : 1;
    }

    function getDayOfWeek(dateStr) {
      return parseLocalDate(dateStr).getDay(); // 0 = Nd, 1 = Pn, ..., 6 = So
    }

    function getStartOfWeek(dateStr, weekStartsOn = 1) {
      const d = parseLocalDate(dateStr);
      const currentDay = d.getDay();
      const diff = (currentDay - weekStartsOn + 7) % 7;
      d.setDate(d.getDate() - diff);
      return toLocalDateString(d);
    }

    function getMonthDays(year, monthZeroIndexed) {
      const result = [];
      const d = new Date(year, monthZeroIndexed, 1, 12, 0, 0);
      while (d.getMonth() === monthZeroIndexed) {
        result.push(toLocalDateString(d));
        d.setDate(d.getDate() + 1);
      }
      return result;
    }

    function getCalendarGridDays(year, monthZeroIndexed, weekStartsOn = 1) {
      const firstDayOfMonth = new Date(year, monthZeroIndexed, 1, 12, 0, 0);
      const startOffset = (firstDayOfMonth.getDay() - weekStartsOn + 7) % 7;
      const gridStart = new Date(year, monthZeroIndexed, 1 - startOffset, 12, 0, 0);

      const daysInMonth = new Date(year, monthZeroIndexed + 1, 0, 12, 0, 0).getDate();
      const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

      const cells = [];
      for (let i = 0; i < totalCells; i++) {
        const cellDate = new Date(
          gridStart.getFullYear(),
          gridStart.getMonth(),
          gridStart.getDate() + i,
          12,
          0,
          0
        );
        cells.push({
          dateStr: toLocalDateString(cellDate),
          inCurrentMonth: cellDate.getMonth() === monthZeroIndexed
        });
      }
      return cells;
    }

    function formatPolishFullDate(dateStr) {
      const d = parseLocalDate(dateStr);
      return new Intl.DateTimeFormat('pl-PL', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }).format(d);
    }

    function formatPolishMonthYear(year, monthZeroIndexed) {
      const d = new Date(year, monthZeroIndexed, 1, 12, 0, 0);
      const formatted = new Intl.DateTimeFormat('pl-PL', {
        month: 'long',
        year: 'numeric'
      }).format(d);
      return formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function formatShortDayMonth(dateStr) {
      const [y, m, d] = String(dateStr).split('-');
      if (!m || !d) return dateStr;
      return `${d}.${m}`;
    }

    const PERIOD_COLORS = {
      amber: {
        id: 'amber',
        label: 'Bursztynowy',
        dot: 'bg-amber-500',
        ribbonBg: 'bg-amber-500/15 dark:bg-amber-400/20',
        ribbonBorder: 'border-amber-400/50 dark:border-amber-500/40',
        badge: 'bg-amber-100/90 dark:bg-amber-950/70 text-amber-900 dark:text-amber-200 border-amber-300/80 dark:border-amber-800',
        bar: 'bg-amber-500 dark:bg-amber-400'
      },
      sky: {
        id: 'sky',
        label: 'Błękitny',
        dot: 'bg-sky-500',
        ribbonBg: 'bg-sky-500/15 dark:bg-sky-400/20',
        ribbonBorder: 'border-sky-400/50 dark:border-sky-500/40',
        badge: 'bg-sky-100/90 dark:bg-sky-950/70 text-sky-900 dark:text-sky-200 border-sky-300/80 dark:border-sky-800',
        bar: 'bg-sky-500 dark:bg-sky-400'
      },
      purple: {
        id: 'purple',
        label: 'Fioletowy',
        dot: 'bg-purple-500',
        ribbonBg: 'bg-purple-500/15 dark:bg-purple-400/20',
        ribbonBorder: 'border-purple-400/50 dark:border-purple-500/40',
        badge: 'bg-purple-100/90 dark:bg-purple-950/70 text-purple-900 dark:text-purple-200 border-purple-300/80 dark:border-purple-800',
        bar: 'bg-purple-500 dark:bg-purple-400'
      },
      rose: {
        id: 'rose',
        label: 'Koralowy',
        dot: 'bg-rose-500',
        ribbonBg: 'bg-rose-500/15 dark:bg-rose-400/20',
        ribbonBorder: 'border-rose-400/50 dark:border-rose-500/40',
        badge: 'bg-rose-100/90 dark:bg-rose-950/70 text-rose-900 dark:text-rose-200 border-rose-300/80 dark:border-rose-800',
        bar: 'bg-rose-500 dark:bg-rose-400'
      },
      teal: {
        id: 'teal',
        label: 'Morski',
        dot: 'bg-teal-500',
        ribbonBg: 'bg-teal-500/15 dark:bg-teal-400/20',
        ribbonBorder: 'border-teal-400/50 dark:border-teal-500/40',
        badge: 'bg-teal-100/90 dark:bg-teal-950/70 text-teal-900 dark:text-teal-200 border-teal-300/80 dark:border-teal-800',
        bar: 'bg-teal-500 dark:bg-teal-400'
      }
    };

    function getPeriodColorMeta(colorKey) {
      return PERIOD_COLORS[colorKey] || PERIOD_COLORS.amber;
    }

    function getPeriodsForDate(dateStr, periods = state.periods) {
      if (!Array.isArray(periods)) return [];
      return periods.filter(
        (p) =>
          compareDateStrings(dateStr, p.startDate) >= 0 &&
          compareDateStrings(dateStr, p.endDate) <= 0
      );
    }

    function getPeriodsForMonth(year, monthZeroIndexed, periods = state.periods) {
      if (!Array.isArray(periods) || periods.length === 0) return [];
      const monthDays = getMonthDays(year, monthZeroIndexed);
      if (monthDays.length === 0) return [];
      const firstDay = monthDays[0];
      const lastDay = monthDays[monthDays.length - 1];
      return periods
        .filter(
          (p) =>
            compareDateStrings(p.startDate, lastDay) <= 0 &&
            compareDateStrings(p.endDate, firstDay) >= 0
        )
        .sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function getPeriodRibbonInfo(dateStr, periods = state.periods) {
      const matching = getPeriodsForDate(dateStr, periods);
      if (matching.length === 0) return null;
      const primary = matching[0];
      const meta = getPeriodColorMeta(primary.color);
      const isStart = primary.startDate === dateStr;
      const isEnd = primary.endDate === dateStr;

      let radiusClass = 'rounded-none';
      if (isStart && isEnd) radiusClass = 'rounded-xl';
      else if (isStart) radiusClass = 'rounded-l-xl rounded-r-none';
      else if (isEnd) radiusClass = 'rounded-r-xl rounded-l-none';

      return {
        period: primary,
        allPeriods: matching,
        meta,
        isStart,
        isEnd,
        radiusClass
      };
    }

    const DAY_LABELS_MON_FIRST = [
      { day: 1, label: 'Pn', full: 'Poniedziałek' },
      { day: 2, label: 'Wt', full: 'Wtorek' },
      { day: 3, label: 'Śr', full: 'Środa' },
      { day: 4, label: 'Cz', full: 'Czwartek' },
      { day: 5, label: 'Pt', full: 'Piątek' },
      { day: 6, label: 'So', full: 'Sobota' },
      { day: 0, label: 'Nd', full: 'Niedziela' }
    ];

    function getOrderedWeekDays(weekStartsOn = 1) {
      if (weekStartsOn === 1) return DAY_LABELS_MON_FIRST;
      return [DAY_LABELS_MON_FIRST[6], ...DAY_LABELS_MON_FIRST.slice(0, 6)];
    }

    function generateId(prefix = 'id') {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return `${prefix}_${crypto.randomUUID()}`;
      }
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /***********************************************************************
     * 3. WARSTWA PRZECHOWYWANIA DANYCH (INDEXEDDB + EKSPORT CSV / JSON)
     ***********************************************************************/
    const DB_NAME = 'rutyna_db';
    const DB_VERSION = 2;

    const DEFAULT_SETTINGS = {
      id: 'user_settings',
      theme: 'system',
      weekStartsOn: 1,
      notificationsEnabled: false
    };

    let dbInstancePromise = null;

    function openDatabase() {
      if (dbInstancePromise) return dbInstancePromise;

      dbInstancePromise = new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('Przeglądarka nie obsługuje bazy danych IndexedDB.'));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = request.result;
          const oldVersion = event.oldVersion;
          if (oldVersion < 1) {
            if (!db.objectStoreNames.contains('habits')) {
              const habitStore = db.createObjectStore('habits', { keyPath: 'id' });
              habitStore.createIndex('by_status', 'status', { unique: false });
            }
            if (!db.objectStoreNames.contains('completions')) {
              const compStore = db.createObjectStore('completions', { keyPath: 'id' });
              compStore.createIndex('by_habit', 'habitId', { unique: false });
              compStore.createIndex('by_date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains('planner_entries')) {
              const planStore = db.createObjectStore('planner_entries', { keyPath: 'id' });
              planStore.createIndex('by_date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings', { keyPath: 'id' });
            }
          }
          if (oldVersion < 2) {
            if (!db.objectStoreNames.contains('periods')) {
              const periodStore = db.createObjectStore('periods', { keyPath: 'id' });
              periodStore.createIndex('by_start', 'startDate', { unique: false });
            }
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => {
          dbInstancePromise = null;
          reject(request.error || new Error('Nie udało się otworzyć bazy IndexedDB.'));
        };
      });

      return dbInstancePromise;
    }

    async function dbGetAll(storeName) {
      const db = await openDatabase();
      if (!db.objectStoreNames.contains(storeName)) return [];
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPut(storeName, record) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error || new Error('Błąd zapisu w bazie danych.'));
      });
    }

    async function dbDelete(storeName, key) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteHabitCascade(habitId) {
      const [completions, plannerEntries, db] = await Promise.all([
        dbGetAll('completions'),
        dbGetAll('planner_entries'),
        openDatabase()
      ]);

      return new Promise((resolve, reject) => {
        const tx = db.transaction(['habits', 'completions', 'planner_entries'], 'readwrite');
        tx.objectStore('habits').delete(habitId);

        const compStore = tx.objectStore('completions');
        completions
          .filter((c) => c.habitId === habitId)
          .forEach((c) => compStore.delete(c.id));

        const planStore = tx.objectStore('planner_entries');
        plannerEntries
          .filter((p) => p.linkedHabitId === habitId)
          .forEach((p) => {
            planStore.put({ ...p, linkedHabitId: undefined, updatedAt: Date.now() });
          });

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /**
     * Całkowite wyczyszczenie wszystkich tabel w bazie danych IndexedDB
     */
    async function dbClearAllData() {
      const db = await openDatabase();
      const stores = ['habits', 'completions', 'planner_entries', 'settings'];
      if (db.objectStoreNames.contains('periods')) stores.push('periods');
      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, 'readwrite');
        stores.forEach((s) => tx.objectStore(s).clear());
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Nie udało się wyczyścić bazy danych.'));
      });
    }

    async function dbSetHabitCompletion(habitId, dateStr, completed) {
      const record = {
        id: `${habitId}_${dateStr}`,
        habitId,
        date: dateStr,
        completed: Boolean(completed),
        updatedAt: Date.now()
      };
      await dbPut('completions', record);
      return record;
    }

    async function dbSavePlannerBatch(entries) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('planner_entries', 'readwrite');
        const store = tx.objectStore('planner_entries');
        entries.forEach((entry) => store.put(entry));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function validateBackupPayload(raw) {
      if (!raw || typeof raw !== 'object') {
        throw new Error('Plik nie zawiera poprawnego obiektu JSON.');
      }
      if (raw.app !== 'Rutyna' || typeof raw.schemaVersion !== 'number') {
        throw new Error('Plik nie jest prawidłową kopią zapasową aplikacji Rutyna.');
      }
      if (!Array.isArray(raw.habits) || !Array.isArray(raw.completions) || !Array.isArray(raw.plannerEntries)) {
        throw new Error('Struktura danych w pliku kopii zapasowej jest niekompletna.');
      }
      for (const h of raw.habits) {
        if (!h || typeof h.id !== 'string' || typeof h.name !== 'string' || !h.schedule) {
          throw new Error('Wykryto nieprawidłowy rekord nawyku w pliku importu.');
        }
      }
      for (const c of raw.completions) {
        if (!c || typeof c.habitId !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(c.date)) {
          throw new Error('Wykryto nieprawidłowy zapis historii wykonania nawyku.');
        }
      }
      for (const p of raw.plannerEntries) {
        if (!p || typeof p.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(p.date) || typeof p.content !== 'string') {
          throw new Error('Wykryto nieprawidłowy wpis planera w pliku importu.');
        }
      }
      const periods = Array.isArray(raw.periods)
        ? raw.periods.filter(
            (per) =>
              per &&
              typeof per.id === 'string' &&
              typeof per.name === 'string' &&
              /^\d{4}-\d{2}-\d{2}$/.test(per.startDate) &&
              /^\d{4}-\d{2}-\d{2}$/.test(per.endDate)
          )
        : [];

      return {
        schemaVersion: raw.schemaVersion,
        exportedAt: raw.exportedAt || new Date().toISOString(),
        app: 'Rutyna',
        habits: raw.habits,
        completions: raw.completions.map((c) => ({
          ...c,
          id: `${c.habitId}_${c.date}`,
          completed: Boolean(c.completed)
        })),
        plannerEntries: raw.plannerEntries,
        periods,
        settings: {
          ...DEFAULT_SETTINGS,
          ...(raw.settings || {}),
          id: 'user_settings'
        }
      };
    }

    async function dbRestoreBackup(validated) {
      const db = await openDatabase();
      const stores = ['habits', 'completions', 'planner_entries', 'settings'];
      const hasPeriods = db.objectStoreNames.contains('periods');
      if (hasPeriods) stores.push('periods');

      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, 'readwrite');
        const hStore = tx.objectStore('habits');
        const cStore = tx.objectStore('completions');
        const pStore = tx.objectStore('planner_entries');
        const sStore = tx.objectStore('settings');

        hStore.clear();
        cStore.clear();
        pStore.clear();
        sStore.clear();

        validated.habits.forEach((h) => hStore.put(h));
        validated.completions.forEach((c) => cStore.put(c));
        validated.plannerEntries.forEach((p) => pStore.put(p));
        sStore.put(validated.settings);

        if (hasPeriods) {
          const perStore = tx.objectStore('periods');
          perStore.clear();
          (validated.periods || []).forEach((per) => perStore.put(per));
        }

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /**
     * Pomocnicze funkcje do eksportu danych w formacie CSV (UTF-8 z BOM + średnik ; dla polskiego Excela)
     */
    function escapeCsvField(val) {
      const s = String(val ?? '').replace(/\r?\n/g, ' ');
      if (s.includes(';') || s.includes('"')) {
        return `"${s.replace(/"/g, '""')}"`;
      }
      return s;
    }

    function downloadCsvFile(filename, headers, rows) {
      const BOM = '\uFEFF';
      const headerLine = headers.map(escapeCsvField).join(';');
      const bodyLines = rows.map((row) => row.map(escapeCsvField).join(';'));
      const csvContent = BOM + [headerLine, ...bodyLines].join('\r\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /***********************************************************************
     * 4. SILNIK LOGIKI DOMENOWEJ (HARMONOGRAMY, SERIE, ZASADA 2 POMINIĘĆ)
     ***********************************************************************/
    function buildCompletionMap(completions) {
      const map = new Map();
      for (const item of completions) {
        if (item.completed) {
          map.set(`${item.habitId}_${item.date}`, true);
        }
      }
      return map;
    }

    function isHabitCompletedOnDate(habitId, dateStr, completionMap) {
      return completionMap.get(`${habitId}_${dateStr}`) === true;
    }

    function isHabitScheduledOnDate(habit, dateStr, completionMap, weekStartsOn = 1) {
      if (compareDateStrings(dateStr, habit.createdAt) < 0) {
        if (completionMap && isHabitCompletedOnDate(habit.id, dateStr, completionMap)) {
          return true;
        }
        return false;
      }

      const schedule = habit.schedule || { type: 'daily' };
      if (schedule.type === 'daily') {
        return true;
      }
      if (schedule.type === 'specific_days') {
        const dow = getDayOfWeek(dateStr);
        return Array.isArray(schedule.daysOfWeek) && schedule.daysOfWeek.includes(dow);
      }
      if (schedule.type === 'times_per_week') {
        const target = Math.max(1, Math.min(7, Number(schedule.timesPerWeek) || 1));
        if (!completionMap) return true;
        if (isHabitCompletedOnDate(habit.id, dateStr, completionMap)) {
          return true;
        }
        const weekStart = getStartOfWeek(dateStr, weekStartsOn);
        let completedInWeek = 0;
        for (let i = 0; i < 7; i++) {
          const d = addDays(weekStart, i);
          if (d !== dateStr && isHabitCompletedOnDate(habit.id, d, completionMap)) {
            completedInWeek++;
          }
        }
        return completedInWeek < target;
      }
      return false;
    }

    function formatScheduleLabel(schedule) {
      if (!schedule || schedule.type === 'daily') return 'Codziennie';
      if (schedule.type === 'specific_days') {
        const days = schedule.daysOfWeek || [];
        if (days.length === 7) return 'Codziennie';
        if (days.length === 5 && [1, 2, 3, 4, 5].every((d) => days.includes(d))) {
          return 'Dni robocze (Pn–Pt)';
        }
        if (days.length === 2 && days.includes(0) && days.includes(6)) {
          return 'Weekendy (So–Nd)';
        }
        const labels = DAY_LABELS_MON_FIRST.filter((item) => days.includes(item.day)).map((i) => i.label);
        return labels.length > 0 ? labels.join(', ') : 'Wybrane dni';
      }
      if (schedule.type === 'times_per_week') {
        const count = Number(schedule.timesPerWeek) || 1;
        return count === 1 ? '1 raz w tygodniu' : `${count} razy w tygodniu`;
      }
      return 'Codziennie';
    }

    /**
     * Zasada „Nie pomijaj dwa razy z rzędu”:
     * Zwraca true, jeśli nawyk jest dziś aktywny, zaplanowany i jeszcze niewykonany,
     * a bezpośrednio poprzedzająca zaplanowana okazja została pominięta.
     */
    function shouldShowNeverMissTwiceAlert(habit, todayStr, completionMap, weekStartsOn = 1) {
      if (habit.status !== 'active') return false;
      if (isHabitCompletedOnDate(habit.id, todayStr, completionMap)) return false;
      if (!isHabitScheduledOnDate(habit, todayStr, completionMap, weekStartsOn)) return false;

      let cursor = addDays(todayStr, -1);
      let checkedDays = 0;
      while (compareDateStrings(cursor, habit.createdAt) >= 0 && checkedDays < 366) {
        checkedDays++;
        if (isHabitScheduledOnDate(habit, cursor, completionMap, weekStartsOn)) {
          const completedPrev = isHabitCompletedOnDate(habit.id, cursor, completionMap);
          return !completedPrev;
        }
        cursor = addDays(cursor, -1);
      }
      return false;
    }

    function calculateHabitStats(habit, todayStr, year, monthZeroIndexed, completionMap, weekStartsOn = 1) {
      let currentStreak = 0;
      let bestStreak = 0;
      let runningStreak = 0;

      let cursor = habit.createdAt;
      if (compareDateStrings(cursor, todayStr) <= 0) {
        while (compareDateStrings(cursor, todayStr) <= 0) {
          const scheduled = isHabitScheduledOnDate(habit, cursor, completionMap, weekStartsOn);
          const completed = isHabitCompletedOnDate(habit.id, cursor, completionMap);

          if (scheduled) {
            if (completed) {
              runningStreak++;
              if (runningStreak > bestStreak) bestStreak = runningStreak;
            } else if (cursor !== todayStr) {
              runningStreak = 0;
            }
          }
          cursor = addDays(cursor, 1);
        }
        currentStreak = runningStreak;
      }

      const monthDays = getMonthDays(year, monthZeroIndexed);
      let monthScheduledCount = 0;
      let monthCompletedCount = 0;

      for (const dayStr of monthDays) {
        if (compareDateStrings(dayStr, todayStr) > 0) continue;
        const scheduled = isHabitScheduledOnDate(habit, dayStr, completionMap, weekStartsOn);
        const completed = isHabitCompletedOnDate(habit.id, dayStr, completionMap);

        if (scheduled) {
          if (dayStr === todayStr && !completed) continue;
          monthScheduledCount++;
          if (completed) monthCompletedCount++;
        }
      }

      const monthCompletionRate =
        monthScheduledCount === 0 ? 0 : Math.round((monthCompletedCount / monthScheduledCount) * 100);

      return {
        currentStreak,
        bestStreak,
        monthCompletionRate,
        monthCompletedCount,
        monthScheduledCount
      };
    }

    function getHabitDayState(habit, dateStr, todayStr, completionMap, weekStartsOn = 1) {
      if (compareDateStrings(dateStr, todayStr) > 0) return 'future';
      if (isHabitCompletedOnDate(habit.id, dateStr, completionMap)) return 'completed';
      if (!isHabitScheduledOnDate(habit, dateStr, completionMap, weekStartsOn)) return 'unscheduled';
      if (dateStr === todayStr) return 'today_pending';
      return 'missed';
    }

    function getDailyAggregateSummary(dateStr, todayStr, habits, completionMap, weekStartsOn = 1) {
      const isFuture = compareDateStrings(dateStr, todayStr) > 0;
      const isToday = dateStr === todayStr;

      const eligibleHabits = habits.filter((h) => {
        if (h.status === 'active') return true;
        if (h.status === 'archived') {
          return compareDateStrings(dateStr, todayStr) < 0 && compareDateStrings(dateStr, h.createdAt) >= 0;
        }
        return false;
      });

      const scheduledHabits = [];
      for (const habit of eligibleHabits) {
        const completed = isHabitCompletedOnDate(habit.id, dateStr, completionMap);
        const scheduled = isHabitScheduledOnDate(habit, dateStr, completionMap, weekStartsOn);
        if (scheduled || completed) {
          scheduledHabits.push({ habit, completed });
        }
      }

      scheduledHabits.sort((a, b) => {
        if (a.habit.important !== b.habit.important) return a.habit.important ? -1 : 1;
        const timeA = a.habit.executionTime || '99:99';
        const timeB = b.habit.executionTime || '99:99';
        if (timeA !== timeB) return timeA.localeCompare(timeB);
        return a.habit.name.localeCompare(b.habit.name, 'pl');
      });

      const scheduledCount = scheduledHabits.length;
      const completedCount = scheduledHabits.filter((i) => i.completed).length;

      let completionRatio = null;
      if (!isFuture && scheduledCount > 0) {
        completionRatio = completedCount / scheduledCount;
      }

      return {
        dateStr,
        isFuture,
        isToday,
        scheduledCount,
        completedCount,
        completionRatio,
        scheduledHabits
      };
    }

    /***********************************************************************
     * 5. OBSŁUGA POWIADOMIEŃ I OGRANICZEŃ iOS PWA
     ***********************************************************************/
    function getNotificationEnvironmentStatus() {
      const ua = navigator.userAgent || '';
      const isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalonePWA =
        window.matchMedia('(display-mode: standalone)').matches ||
        Boolean(navigator.standalone);
      const supported = 'Notification' in window;
      const permission = supported ? Notification.permission : 'unsupported';

      let backgroundPushNote =
        'Lokalne przypomnienia działają, gdy aplikacja jest otwarta na ekranie lub w pamięci przeglądarki. Dostarczanie powiadomień przy całkowicie zamkniętej aplikacji wymaga zewnętrznego serwera Web Push (VAPID).';

      if (isIOS && !isStandalonePWA) {
        backgroundPushNote =
          'Na iPhonie powiadomienia webowe wymagają najpierw dodania aplikacji „Rutyna” do ekranu początkowego (Udostępnij → Dodaj do ekranu początkowego) oraz systemu iOS 16.4+.';
      }

      return {
        supported,
        permission,
        isIOS,
        isStandalonePWA,
        canReceiveLocalForeground: supported && permission === 'granted',
        backgroundPushNote
      };
    }

    async function requestNotificationPermissionInteractive() {
      const status = getNotificationEnvironmentStatus();
      if (!status.supported) {
        if (status.isIOS && !status.isStandalonePWA) {
          return {
            granted: false,
            message:
              'Aby włączyć powiadomienia na iPhonie, dodaj najpierw aplikację Rutyna do ekranu początkowego (Udostępnij → Dodaj do ekranu początkowego).'
          };
        }
        return {
          granted: false,
          message: 'Twoja przeglądarka nie obsługuje API powiadomień webowych.'
        };
      }

      try {
        const result = await Notification.requestPermission();
        if (result === 'granted') {
          return {
            granted: true,
            message: 'Uprawnienia do powiadomień zostały przyznane. Lokalne przypomnienia są aktywne.'
          };
        }
        if (result === 'denied') {
          return {
            granted: false,
            message: 'Powiadomienia zostały zablokowane w ustawieniach przeglądarki lub systemu iOS.'
          };
        }
        return {
          granted: false,
          message: 'Nie udzielono zgody na powiadomienia.'
        };
      } catch {
        return {
          granted: false,
          message: 'Wystąpił błąd podczas proszenia o uprawnienia do powiadomień.'
        };
      }
    }

    async function sendImmediateNotification(title, body) {
      const status = getNotificationEnvironmentStatus();
      if (!status.supported || status.permission !== 'granted') return false;
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg && 'showNotification' in reg) {
            await reg.showNotification(title, {
              body,
              icon: ICON_SVG_DATA_URI,
              badge: ICON_SVG_DATA_URI,
              tag: `rutyna_${Date.now()}`
            });
            return true;
          }
        }
        new Notification(title, { body, icon: ICON_SVG_DATA_URI });
        return true;
      } catch {
        return false;
      }
    }

    /***********************************************************************
     * 6. WBUDOWANY ZESTAW TESTÓW JEDNOSTKOWYCH (Z MOŻLIWOŚCIĄ UKRYCIA)
     ***********************************************************************/
    function runBuiltInUnitTests() {
      const results = [];
      const assert = (name, condition, details = '') => {
        results.push({ name, passed: Boolean(condition), details });
      };

      const today = '2026-10-18'; // Niedziela
      const dailyHabit = {
        id: 'h_daily',
        name: 'Czytanie',
        createdAt: '2026-10-01',
        status: 'active',
        schedule: { type: 'daily' },
        important: true,
        reminder: { enabled: false, time: '08:00' }
      };

      const sampleDate = parseLocalDate('2026-03-29');
      assert(
        '1. Odporność dat lokalnych na zmianę czasu (DST)',
        toLocalDateString(sampleDate) === '2026-03-29' && addDays('2026-03-29', 1) === '2026-03-30'
      );

      const emptySummary = getDailyAggregateSummary(today, today, [], new Map(), 1);
      assert(
        '2. Pusty stan aplikacji zwraca 0 zaplanowanych nawyków i neutralny wskaźnik',
        emptySummary.scheduledCount === 0 && emptySummary.completionRatio === null
      );

      assert(
        '3. Harmonogram codzienny (aktywny po dacie utworzenia, nieaktywny przed)',
        isHabitScheduledOnDate(dailyHabit, today, new Map(), 1) === true &&
          isHabitScheduledOnDate(dailyHabit, '2026-09-25', new Map(), 1) === false
      );

      const mwfHabit = {
        ...dailyHabit,
        id: 'h_mwf',
        schedule: { type: 'specific_days', daysOfWeek: [1, 3, 5] }
      };
      assert(
        '4. Harmonogram wybranych dni tygodnia (Pt=zaplanowany, Nd=niezaplanowany)',
        isHabitScheduledOnDate(mwfHabit, '2026-10-16', new Map(), 1) === true &&
          isHabitScheduledOnDate(mwfHabit, '2026-10-18', new Map(), 1) === false
      );

      const compMapSingle = buildCompletionMap([
        { id: 'h_daily_2026-10-18', habitId: 'h_daily', date: today, completed: true }
      ]);
      const sumAfterToggle = getDailyAggregateSummary(today, today, [dailyHabit], compMapSingle, 1);
      assert(
        '5. Jeden spójny stan wykonania dziennie i aktualizacja podsumowania',
        sumAfterToggle.completedCount === 1 && sumAfterToggle.scheduledCount === 1
      );

      const compMapUndone = buildCompletionMap([
        { id: 'h_daily_2026-10-18', habitId: 'h_daily', date: today, completed: false }
      ]);
      const sumAfterUndo = getDailyAggregateSummary(today, today, [dailyHabit], compMapUndone, 1);
      assert(
        '6. Cofnięcie wykonania aktualizuje podsumowanie do 0/1',
        sumAfterUndo.completedCount === 0 && sumAfterUndo.completionRatio === 0
      );

      const unscheduledState = getHabitDayState(mwfHabit, '2026-10-17', today, new Map(), 1);
      assert(
        '7. Dni poza harmonogramem mają status "unscheduled", a nie "missed"',
        unscheduledState === 'unscheduled'
      );

      const futureState = getHabitDayState(dailyHabit, '2026-10-19', today, new Map(), 1);
      assert(
        '8. Przyszłe dni mają status "future" i nie obniżają statystyk',
        futureState === 'future'
      );

      const alertTriggeredDaily = shouldShowNeverMissTwiceAlert(dailyHabit, today, new Map(), 1);
      assert(
        '9. Alert "Nie przerywaj rytmu" włącza się po pominięciu poprzedniej okazji',
        alertTriggeredDaily === true
      );

      const alertClearedDaily = shouldShowNeverMissTwiceAlert(dailyHabit, today, compMapSingle, 1);
      assert(
        '10. Alert "Nie przerywaj rytmu" znika po wykonaniu nawyku dziś',
        alertClearedDaily === false
      );

      const mwfMap = buildCompletionMap([
        { id: 'h_mwf_2026-10-16', habitId: 'h_mwf', date: '2026-10-16', completed: true }
      ]);
      assert(
        '11. Dni poza harmonogramem (weekend) nie wywołują fałszywego alertu w poniedziałek',
        shouldShowNeverMissTwiceAlert(mwfHabit, '2026-10-19', mwfMap, 1) === false
      );

      const streakMap = buildCompletionMap([
        { id: 'h_daily_2026-10-15', habitId: 'h_daily', date: '2026-10-15', completed: true },
        { id: 'h_daily_2026-10-16', habitId: 'h_daily', date: '2026-10-16', completed: true },
        { id: 'h_daily_2026-10-17', habitId: 'h_daily', date: '2026-10-17', completed: true }
      ]);
      const stats = calculateHabitStats(dailyHabit, today, 2026, 9, streakMap, 1);
      assert(
        '12. Seria nawyku (3 dni z rzędu do wczoraj) jest zachowana w trakcie dzisiejszego dnia',
        stats.currentStreak === 3 && stats.bestStreak === 3
      );

      const archivedHabit = { ...dailyHabit, id: 'h_arch', status: 'archived' };
      const todayWithArchived = getDailyAggregateSummary(today, today, [archivedHabit], new Map(), 1);
      const pastWithArchived = getDailyAggregateSummary('2026-10-10', today, [archivedHabit], new Map(), 1);
      assert(
        '13. Archiwizacja ukrywa nawyk z planu na dziś, ale zachowuje go w historii',
        todayWithArchived.scheduledCount === 0 && pastWithArchived.scheduledCount === 1
      );

      let invalidRejected = false;
      try {
        validateBackupPayload({ app: 'InnaAplikacja' });
      } catch {
        invalidRejected = true;
      }

    const firedReminderKeys = new Set();
    function startReminderLoop() {
      setInterval(() => {
        const now = new Date();
        const currentToday = toLocalDateString(now);
        if (currentToday !== state.todayStr) {
          state.todayStr = currentToday;
          renderApp();
        }

        const envStatus = getNotificationEnvironmentStatus();
        if (!envStatus.canReceiveLocalForeground) return;

        const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const completionMap = buildCompletionMap(state.completions);

        for (const habit of state.habits) {
          if (habit.status !== 'active' || !habit.reminder?.enabled || habit.reminder.time !== hhmm) {
            continue;
          }
          const key = `${habit.id}_${currentToday}_${hhmm}`;
          if (firedReminderKeys.has(key)) continue;

          const scheduled = isHabitScheduledOnDate(habit, currentToday, completionMap, state.settings.weekStartsOn);
          const completed = isHabitCompletedOnDate(habit.id, currentToday, completionMap);
          if (scheduled && !completed) {
            firedReminderKeys.add(key);
            sendImmediateNotification(
              `Przypomnienie: ${habit.name}`,
              habit.note ? habit.note : 'Zaplanowany nawyk czeka na wykonanie dzisiaj.'
            );
          }
        }
      }, 30000);
    }

      try {
        const completionMap = buildCompletionMap(state.completions);
        const currentlyCompleted = isHabitCompletedOnDate(habitId, dateStr, completionMap);
        const nextCompleted = !currentlyCompleted;

        if (dateStr === state.todayStr) {
          state.justToggledHabitId = habitId;
          setTimeout(() => {
            if (state.justToggledHabitId === habitId) {
              state.justToggledHabitId = null;
              renderApp();
            }
          }, 320);
        }

        const saved = await dbSetHabitCompletion(habitId, dateStr, nextCompleted);
        const idx = state.completions.findIndex((c) => c.id === saved.id);
        if (idx >= 0) {
          state.completions[idx] = saved;
        } else {
          state.completions.push(saved);
        }
        renderApp();
      } catch {
        showToast('Nie udało się zapisać zmiany wykonania nawyku.', 'error');
      }
    }

    async function movePlannerEntryOrder(entryId, direction) {
      const entry = state.plannerEntries.find((e) => e.id === entryId);
      if (!entry) return;

      const dayList = state.plannerEntries
        .filter((e) => e.date === state.plannerSelectedDate)
        .filter((e) =>
          state.plannerMode === 'period'
            ? (e.timeOfDay || 'morning') === (entry.timeOfDay || 'morning')
            : true
        )
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      const idx = dayList.findIndex((e) => e.id === entryId);
      const swapIdx = idx + direction;
      if (idx < 0 || swapIdx < 0 || swapIdx >= dayList.length) return;

      const a = dayList[idx];
      const b = dayList[swapIdx];
      const orderA = a.order ?? idx;
      const orderB = b.order ?? swapIdx;

      const updatedA = { ...a, order: orderB === orderA ? orderA + direction : orderB, updatedAt: Date.now() };
      const updatedB = { ...b, order: orderA, updatedAt: Date.now() };

      await dbSavePlannerBatch([updatedA, updatedB]);
      state.plannerEntries = state.plannerEntries.map((item) => {
        if (item.id === updatedA.id) return updatedA;
        if (item.id === updatedB.id) return updatedB;
        return item;
      });
      renderApp();
    }
